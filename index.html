  initTheme();
  renderFilters(); renderSnippets(); renderKeyboard(); loadRepoHistory(); renderProgress(); renderStats();
  const input = document.getElementById('hiddenInput');
  input.addEventListener('input', handleInput);
  input.addEventListener('keydown', handleKeyDown);
  input.addEventListener('compositionstart', () => { isComposing = true; });
  input.addEventListener('compositionend', (e) => {
    isComposing = false;
    if (!startTime && e.data) { startTime = Date.now(); timerInterval = setInterval(updateStats, 200); }
    if (e.data) { for (const ch of e.data) processChar(ch); }
    input.value = '';
  });
  document.addEventListener('click', function(e) {
    if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA' && !e.target.closest('.file-item') && !e.target.closest('.snippet-card') && !e.target.closest('.history-item') && !e.target.closest('.lang-tag') && !e.target.closest('.tab')) {
      if (document.getElementById('practiceView').style.display !== 'none') focusInput();
    }
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      if (document.getElementById('resultModal').classList.contains('show')) {
        closeModal();
      } else if (document.getElementById('practiceView').style.display !== 'none') {
        goHome();
      }
    }
  });
}

function renderFilters() {
  const catContainer = document.getElementById('categoryFilter');
  const diffContainer = document.getElementById('difficultyFilter');
  if (catContainer) catContainer.innerHTML = CATEGORIES.map(c =>
    `<span class="filter-tag ${currentCategory===c.id?'active':''}" onclick="setCategory('${c.id}')">${c.icon} ${c.name}</span>`
  ).join('');
  if (diffContainer) diffContainer.innerHTML = DIFFICULTIES.map(d =>
    `<span class="filter-tag ${currentDifficulty===d.id?'active':''}" onclick="setDifficulty('${d.id}')">${d.name}</span>`
  ).join('');
}
function setCategory(c) { currentCategory = c; renderFilters(); renderSnippets(); }
function setDifficulty(d) { currentDifficulty = d; renderFilters(); renderSnippets(); }

function getHistory() { try { return JSON.parse(localStorage.getItem('codetype_history') || '[]'); } catch(e) { return []; } }
function saveHistory(record) {
  const history = getHistory();
  history.unshift(record);
  if (history.length > 200) history.pop();
  localStorage.setItem('codetype_history', JSON.stringify(history));
}
function getBest(snippetId) {
  try { return JSON.parse(localStorage.getItem('codetype_best_' + snippetId) || 'null'); } catch(e) { return null; }
}
function saveBest(snippetId, record) {
  const best = getBest(snippetId);
  if (!best || record.cpm > best.cpm) {
    localStorage.setItem('codetype_best_' + snippetId, JSON.stringify(record));
    return true;
  }
  return false;
}
function getCompletedIds() {
  return new Set(getHistory().map(h => h.snippetId));
}
function getProgress() {
  const completed = getCompletedIds();
  const byCategory = {};
  for (const cat of ['ds', 'algo', 'dl']) {
    const catSnips = SNIPPETS.filter(s => s.category === cat);
    const done = catSnips.filter(s => completed.has(s.id)).length;
    byCategory[cat] = { done, total: catSnips.length };
  }
  return { total: SNIPPETS.length, done: completed.size, byCategory };
}
function renderProgress() {
  const el = document.getElementById('progressBar');
  if (!el) return;
  const prog = getProgress();
  const pct = prog.total > 0 ? (prog.done / prog.total * 100) : 0;
  const catNames = { ds: '数据结构', algo: '算法', dl: '深度学习' };
  let catHtml = '';
  for (const cat of ['ds', 'algo', 'dl']) {
    const p = prog.byCategory[cat];
    const cpct = p.total > 0 ? (p.done / p.total * 100) : 0;
    catHtml += `<div class="progress-item"><span class="progress-label">${catNames[cat]}</span><span class="progress-value">${p.done}/${p.total}</span></div>
      <div class="progress-track small"><div class="progress-fill" style="width:${cpct}%"></div></div>`;
  }
  el.innerHTML = `<div class="progress-overview">
    <div class="progress-item"><span class="progress-label">总进度</span><span class="progress-value">${prog.done}/${prog.total}</span></div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    ${catHtml}
  </div>`;
}

function renderStats() {
  const history = getHistory();
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const weekStart = todayStart - (now.getDay() === 0 ? 6 : now.getDay() - 1) * 86400000;
  const todayCount = history.filter(h => h.date >= todayStart).length;
  const weekCount = history.filter(h => h.date >= weekStart).length;
  // 连续天数计算
  const daySet = new Set(history.map(h => { const d = new Date(h.date); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }));
  let streak = 0;
  let checkDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  while (daySet.has(checkDate.getFullYear()+'-'+checkDate.getMonth()+'-'+checkDate.getDate())) { streak++; checkDate.setDate(checkDate.getDate() - 1); }
  if (history.length === 0) {
    document.getElementById('statToday').textContent = '0';
    document.getElementById('statWeek').textContent = '0';
    document.getElementById('statCount').textContent = '0';
    document.getElementById('statChars').textContent = '0';
    document.getElementById('statTime').textContent = '0分';
    document.getElementById('statAvgCpm').textContent = '0';
    document.getElementById('statAvgAcc').textContent = '0%';
    document.getElementById('statMaxCpm').textContent = '0';
    document.getElementById('statErrors').textContent = '0';
    document.getElementById('statStreak').textContent = '0天';
    return;
  }
  const count = history.length;
  const totalChars = history.reduce((s,h) => s + (h.cpm * h.time / 60), 0);
  const totalTime = history.reduce((s,h) => s + h.time, 0);
  const avgCpm = Math.round(history.reduce((s,h) => s + h.cpm, 0) / count);
  const avgAcc = Math.round(history.reduce((s,h) => s + h.acc, 0) / count);
  const maxCpm = Math.max(...history.map(h => h.cpm));
  const totalErrors = history.reduce((s,h) => s + (h.errors || 0), 0);
  const mins = Math.floor(totalTime / 60);
  document.getElementById('statToday').textContent = todayCount;
  document.getElementById('statWeek').textContent = weekCount;
  document.getElementById('statCount').textContent = count;
  document.getElementById('statChars').textContent = Math.round(totalChars);
  document.getElementById('statTime').textContent = mins >= 60 ? Math.floor(mins/60)+'时'+(mins%60)+'分' : mins+'分';
  document.getElementById('statAvgCpm').textContent = avgCpm;
  document.getElementById('statAvgAcc').textContent = avgAcc + '%';
  document.getElementById('statMaxCpm').textContent = maxCpm;
  document.getElementById('statErrors').textContent = totalErrors;
  document.getElementById('statStreak').textContent = streak + '天';
}

function renderSnippets() {
  const container = document.getElementById('snippetGrid');
  if (!container) return;
  const filtered = SNIPPETS.filter(s =>
    (currentCategory === 'all' || s.category === currentCategory) &&

  );

    const bestInfo = best ? `<div class="best-info">最佳: ${best.cpm} CPM · ${best.acc}%</div>` : '';
    return `<div class="snippet-card ${isDone?'completed':''}" onclick="startPractice(${s.id})">

        <span class="diff-badge" style="color:${diffColor};border-color:${diffColor}">${diffName}</span>
        ${isDone ? '<span class="done-badge">✓</span>' : ''}

function renderKeyboard() {
  document.getElementById('keyboard').innerHTML = KB_LAYOUT.map(row => `<div class="kb-row">${row.map(key => `<div class="key f-${key.f} ${key.w||''}" data-key="${key.k.toLowerCase()}">${key.k}</div>`).join('')}</div>`).join('');
}

function highlightKey(char) {
  document.querySelectorAll('.key').forEach(k => k.classList.remove('active','shift-active'));
  if (!char) return;
  const needsShift = (char >= 'A' && char <= 'Z') || '~!@#$%^&*()_+{}|:"<>?'.includes(char);
  const lower = char.toLowerCase();
  const keyMap = { ' ':'space', '\n':'enter', '\t':'tab' };
  const search = keyMap[char] || lower;
  document.querySelectorAll('.key').forEach(k => { if (k.dataset.key === search) k.classList.add('active'); if (needsShift && k.dataset.key === 'shift') k.classList.add('shift-active'); });
}

async function loadRepo() {
  const url = document.getElementById('repoInput').value.trim();
  const content = document.getElementById('repoContent');
  if (!url) { content.innerHTML = '<div class="error-msg">请输入仓库地址</div>'; return; }
  const match = url.match(/github\.com\/([^\/]+)\/([^\/\s]+?)(?:\.git)?\/?$/);
  if (!match) { content.innerHTML = '<div class="error-msg">无效的 GitHub 地址，格式如 https://github.com/user/repo</div>'; return; }
  const owner = match[1], repo = match[2];
  content.innerHTML = '<div class="loading">正在加载仓库...</div>';
  try {
    currentBranch = 'main';
    try { const r = await fetch(`https://api.github.com/repos/${owner}/${repo}`); if (r.ok) currentBranch = (await r.json()).default_branch || 'main'; } catch(e) {}
    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${currentBranch}?recursive=1`);
    if (!res.ok) { if (res.status === 403) { content.innerHTML = '<div class="error-msg">GitHub API 访问频率受限，请稍后再试</div>'; return; } throw new Error('HTTP ' + res.status); }
    const data = await res.json();
    const exts = ['.rs','.c','.h','.py','.js','.ts','.go','.java','.cpp','.hpp','.html','.css','.json','.md','.toml','.yaml','.yml','.sh','.rb','.php','.swift','.kt'];
    repoFiles = (data.tree || []).filter(f => f.type === 'blob' && exts.some(ext => f.path.endsWith(ext)));
    saveRepoHistory(url, document.getElementById('repoNote').value.trim());
    document.getElementById('fileSearchBox').style.display = 'block';
    document.getElementById('fileSearch').value = '';
    document.getElementById('repoNote').value = '';
    expandedFolders.clear();
    renderFileTree(owner, repo);
  } catch(e) { content.innerHTML = `<div class="error-msg">加载失败: ${e.message}</div>`; }
}

function buildTree(files) {
  const root = {};
  files.forEach(f => {
    const parts = f.path.split('/').filter(Boolean);
    if (parts.length === 0) return;
    let node = root;
    parts.forEach((p, i) => {
      if (i === parts.length - 1) node[p] = { ...f, type: 'file' };
      else { if (!node[p]) node[p] = { type: 'folder', children: {} }; node = node[p].children; }
    });
  });
  return root;
}

function renderFileTree(owner, repo, filter = '') {
  const content = document.getElementById('repoContent');
  try {
    const tree = buildTree(repoFiles);
    let html = `<div style="margin-bottom:8px;color:var(--text2);font-size:13px">找到 ${repoFiles.length} 个代码文件</div>`;
    html += renderTreeNode(tree, '', owner, repo, 0, filter);
    content.innerHTML = html;
  } catch(e) {
    content.innerHTML = `<div class="error-msg">文件树渲染失败: ${e.message}<br><button class="btn" style="margin-top:8px" onclick="loadRepo()">重新加载</button></div>`;
  }
}

function renderTreeNode(node, prefix, owner, repo, depth, filter) {
  if (!node || typeof node !== 'object' || depth > 20) return depth > 20 ? '<div style="padding-left:16px;color:var(--text2)">...</div>' : '';
  let html = '';
  let entries;
  try { entries = Object.entries(node).sort((a,b) => { if (a[1].type !== b[1].type) return a[1].type === 'folder' ? -1 : 1; return a[0].localeCompare(b[0]); }); }
  catch(e) { return ''; }
  for (const [name, item] of entries) {
    if (!item || typeof item !== 'object') continue;
    const path = prefix ? prefix + '/' + name : name;
    if (item.type === 'folder') {
      const expanded = expandedFolders.has(path) || filter;
      const count = countFiles(item, 0);
      html += `<div class="file-item folder-item ${expanded?'expanded':''}" style="padding-left:${16+depth*16}px" onclick="toggleFolder('${path}')"><span class="arrow">▶</span><span>📁</span><span>${name}/</span><span style="margin-left:auto;color:var(--text2);font-size:11px">${count}个文件</span></div>`;
      if (expanded && item.children) html += renderTreeNode(item.children, path, owner, repo, depth+1, filter);
    } else if (item.type === 'file') {
      if (filter && !name.toLowerCase().includes(filter.toLowerCase())) continue;
      html += `<div class="file-item" style="padding-left:${16+depth*16}px" onclick="loadGithubFile('${owner}','${repo}','${item.path}')"><span style="width:16px"></span><span>📄</span><span>${name}</span><span style="margin-left:auto;color:var(--text2);font-size:11px">${(item.size/1024).toFixed(1)}KB</span></div>`;
    }
  }
  return html;
}

function countFiles(node, depth) {
  if (!node || typeof node !== 'object') return 0;
  if (depth > 50) return 0;
  let count = 0;
  const children = node.children ? node.children : node;
  for (const key in children) {
    const item = children[key];
    if (!item || typeof item !== 'object') continue;
    if (item.type === 'file') count++;
    else if (item.type === 'folder') count += countFiles(item, depth + 1);
  }
  return count;
}

function toggleFolder(path) {
  if (expandedFolders.has(path)) expandedFolders.delete(path); else expandedFolders.add(path);
  const url = document.getElementById('repoInput').value.trim();
  const match = url.match(/github\.com\/([^\/]+)\/([^\/\s]+?)(?:\.git)?\/?$/);
  if (match) renderFileTree(match[1], match[2], document.getElementById('fileSearch').value);
}

function filterFiles() {
  const filter = document.getElementById('fileSearch').value;
  const url = document.getElementById('repoInput').value.trim();
  const match = url.match(/github\.com\/([^\/]+)\/([^\/\s]+?)(?:\.git)?\/?$/);
  if (match) renderFileTree(match[1], match[2], filter);
}

async function loadGithubFile(owner, repo, path) {
  try {
    const encodedPath = path.split('/').map(encodeURIComponent).join('/');
    const res = await fetch(`https://raw.githubusercontent.com/${owner}/${repo}/${currentBranch}/${encodedPath}`);
    if (!res.ok) throw new Error('HTTP ' + res.status + ' - 文件加载失败');
    let code = (await res.text()).replace(/\r\n/g, '\n');
    const lines = code.split('\n').length;
    if (lines > 500) { if (confirm(`文件共 ${lines} 行，较长。\n点击"确定"截取前 200 行练习，点击"取消"完整练习。`)) code = code.split('\n').slice(0, 200).join('\n'); }
    const ext = path.split('.').pop().toLowerCase();
    const langMap = {
      rs: 'rust', c: 'c', h: 'c', cpp: 'c', cc: 'c', cxx: 'c', hpp: 'c',
      py: 'python', rb: 'python', sh: 'python', yaml: 'python', yml: 'python',
      js: 'c', ts: 'c', jsx: 'c', tsx: 'c', java: 'c', go: 'c', php: 'c',
      json: 'c', css: 'c', html: 'c', md: 'python', toml: 'python'
    };
    const lang = langMap[ext] || 'c';
    startPracticeWithCode(code, path, lang);
  } catch(e) { alert('加载文件失败: ' + e.message); }
}

function saveRepoHistory(url, note) {
  let h = JSON.parse(localStorage.getItem('codetype_repo_history') || '[]');
  h = h.filter(x => (typeof x === 'string' ? x : x.url) !== url);
  h.unshift({ url, note: note || '' });
  h = h.slice(0, 5);
  localStorage.setItem('codetype_repo_history', JSON.stringify(h)); loadRepoHistory();
}
function loadRepoHistory() {
  const h = JSON.parse(localStorage.getItem('codetype_repo_history') || '[]');
  const el = document.getElementById('repoHistory');
  if (h.length === 0) { el.innerHTML = ''; return; }
  el.innerHTML = '<div style="font-size:12px;color:var(--text2);margin-bottom:4px">最近仓库：</div>' + h.map((item, i) => {
    const url = typeof item === 'string' ? item : item.url;
    const note = typeof item === 'string' ? '' : (item.note || '');
    return `<div class="history-item" onclick="document.getElementById('repoInput').value='${url}';loadRepo()"><span>${url}</span>${note?`<span style="color:var(--blue);font-size:11px;margin:0 8px">${note}</span>`:''}<span style="color:var(--red)" onclick="event.stopPropagation();removeRepo(${i})">✕</span></div>`;
  }).join('');
  if (h.length > 0) document.getElementById('repoInput').value = typeof h[0] === 'string' ? h[0] : h[0].url;
}
function removeRepo(i) { let h = JSON.parse(localStorage.getItem('codetype_repo_history') || '[]'); h.splice(i, 1); localStorage.setItem('codetype_repo_history', JSON.stringify(h)); loadRepoHistory(); }

function startPractice(id) {
  const s = SNIPPETS.find(x => x.id === id);
  if (s) startPracticeWithCode(s.code, s.name, s.lang, s.id);
}

function startPracticeWithCode(code, title, lang, snippetId = -1) {
  currentSnippetId = snippetId;
  const pp = document.getElementById("practiceProgress");
  if (pp) { const prog = getProgress(); const pct = prog.total > 0 ? (prog.done/prog.total*100) : 0; pp.innerHTML = `<div class="progress-overview"><div class="progress-item"><span class="progress-label">总进度</span><span class="progress-value">${prog.done}/${prog.total}</span></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div></div>`; }
  currentTokens = tokenize(code, lang);
  flatTokens = currentTokens.flat();
  totalTypable = flatTokens.filter(t => t.typable).length;
  currentTitle = title; currentLang = lang; currentPos = 0; startTime = null;
  userInput = new Array(flatTokens.length).fill(null);
  charStatus = flatTokens.map(t => t.typable ? 'pending' : 'skip');
  document.getElementById('selectView').style.display = 'none';
  document.getElementById('practiceView').style.display = 'block';
  document.getElementById('codeTitle').innerHTML = `<span class="lang-badge lang-${lang}" style="margin-right:8px">${lang.toUpperCase()}</span>${title}`;
  skipNonTypable(); renderCode(); updateStats(); focusInput();
}

function skipNonTypable() { while (currentPos < flatTokens.length && !flatTokens[currentPos].typable) currentPos++; }

function renderCode() {
  const scroll = document.getElementById('codeScroll');
  let html = ''; let charIdx = 0; let currentLineIdx = 0;
  let count = 0;
  let found = false;
  for (let li = 0; li < currentTokens.length; li++) {
    if (currentPos < count + currentTokens[li].length) { currentLineIdx = li; found = true; break; }
    count += currentTokens[li].length;
  }
  if (!found) currentLineIdx = currentTokens.length - 1;
  charIdx = 0;
  currentTokens.forEach((lineTokens, li) => {
    const isCurrent = li === currentLineIdx;
    let lineHtml = '';
    for (const tok of lineTokens) {
      let cls = `char t-${tok.type}`;
      let displayChar = tok.char;
      if (!tok.typable) {
        cls += ' skip';
      } else if (charStatus[charIdx] === 'correct') {
        cls += ' correct';
      } else if (charStatus[charIdx] === 'incorrect') {
        cls += ' incorrect';
        if (userInput[charIdx] !== null && userInput[charIdx] !== '') {
          displayChar = userInput[charIdx];
        }
      } else if (charIdx === currentPos) {
        cls += ' current';
      } else {
        cls += ' pending';
      }
      if (displayChar === ' ' || displayChar === '\n') cls += ' space';
      const shown = displayChar === '\n' ? '↵\n' : displayChar === ' ' ? '·' : displayChar;
      lineHtml += `<span class="${cls}">${shown}</span>`;
      charIdx++;
    }
    if (lineHtml === '') lineHtml = '&nbsp;';
    html += `<div class="code-line"><span class="line-num">${li+1}</span><span class="line-content ${isCurrent?'current-line':''}">${lineHtml}</span></div>`;
  });
  scroll.innerHTML = html;
  const curTok = flatTokens[currentPos];
  if (curTok) highlightKey(curTok.char);
  const currentLineEl = scroll.querySelector('.current-line');
  if (currentLineEl) {
    const containerRect = scroll.getBoundingClientRect();
    const lineRect = currentLineEl.getBoundingClientRect();
    const lineTop = lineRect.top - containerRect.top + scroll.scrollTop;
    const containerH = scroll.clientHeight;
    const targetScroll = lineTop - containerH * 0.3;
    const maxScroll = Math.max(0, scroll.scrollHeight - containerH);
    scroll.scrollTop = Math.max(0, Math.min(targetScroll, maxScroll));
  } else {
    scroll.scrollTop = scroll.scrollHeight;
  }
}

function focusInput() { document.getElementById('hiddenInput').focus(); }

function handleInput(e) {
  if (isComposing) return;
  if (!startTime) { startTime = Date.now(); timerInterval = setInterval(updateStats, 200); }
  const input = e.target.value;
  if (input.length > 0) { for (const ch of input) processChar(ch); e.target.value = ''; }
}

function processChar(ch) {
  if (currentPos >= flatTokens.length) return;
  skipNonTypable();
  if (currentPos >= flatTokens.length) { finishPractice(); return; }
  const cur = flatTokens[currentPos];
  userInput[currentPos] = ch;
  charStatus[currentPos] = (ch === cur.char) ? 'correct' : 'incorrect';
  currentPos++;
  skipNonTypable(); renderCode(); updateStats();
  if (currentPos >= flatTokens.length) finishPractice();
}

function handleKeyDown(e) {
  if (isComposing) return;
  // 阻止方向键、PageUp/PageDown、Home/End 导致页面滚动
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','PageUp','PageDown','Home','End'].includes(e.key)) {
    e.preventDefault();
    return;
  }
  if (e.key === 'Tab') {
    e.preventDefault();
    if (!startTime) { startTime = Date.now(); timerInterval = setInterval(updateStats, 200); }
    for (let i = 0; i < 4; i++) {
      if (currentPos >= flatTokens.length) break;
      skipNonTypable();
      if (currentPos >= flatTokens.length) break;
      userInput[currentPos] = ' ';
      charStatus[currentPos] = (flatTokens[currentPos].char === ' ') ? 'correct' : 'incorrect';
      currentPos++;
    }
    skipNonTypable(); renderCode(); updateStats();
    if (currentPos >= flatTokens.length) finishPractice();
  } else if (e.key === 'Backspace') {
    e.preventDefault();
    if (currentPos > 0) {
      currentPos--;
      while (currentPos > 0 && !flatTokens[currentPos].typable) currentPos--;
      if (flatTokens[currentPos].typable) {
        userInput[currentPos] = null;
        charStatus[currentPos] = 'pending';
      }
      renderCode(); updateStats();
    }
  } else if (e.key === 'Delete') {
    e.preventDefault();
    skipChar();
  }
}

function skipChar() {
  if (currentPos < flatTokens.length) {
    skipNonTypable();
    if (currentPos < flatTokens.length && flatTokens[currentPos].typable) {
      userInput[currentPos] = '';
      charStatus[currentPos] = 'incorrect';
      currentPos++;
    }
    skipNonTypable(); renderCode(); updateStats();
    if (currentPos >= flatTokens.length) finishPractice();
  }
  focusInput();
}

function resetPractice() {
  currentPos = 0; startTime = null;
  if (timerInterval) clearInterval(timerInterval);
  document.getElementById('hiddenInput').value = '';
  userInput = new Array(flatTokens.length).fill(null);
  charStatus = flatTokens.map(t => t.typable ? 'pending' : 'skip');
  skipNonTypable(); renderCode(); updateStats(); focusInput();
}

function updateStats() {
  const elapsed = startTime ? (Date.now() - startTime) / 1000 : 0;
  const minutes = elapsed / 60;
  let correct = 0, errors = 0, typed = 0;
  for (let i = 0; i < charStatus.length; i++) {
    if (charStatus[i] === 'correct') { correct++; typed++; }
    else if (charStatus[i] === 'incorrect') { errors++; typed++; }
  }
  const cpm = minutes > 0 ? Math.round(typed / minutes) : 0;
  const wpm = minutes > 0 ? Math.round(correct / 5 / minutes) : 0;
  const acc = typed > 0 ? Math.round((correct / typed) * 100) : 100;
  const progress = totalTypable > 0 ? (typed / totalTypable) * 100 : 0;
  document.getElementById('practiceTime').textContent = Math.round(elapsed) + 's';
  document.getElementById('statCpm').textContent = cpm;
  document.getElementById('statWpm').textContent = wpm;
  document.getElementById('statAcc').textContent = acc + '%';
  document.getElementById('statErr').textContent = errors;
  document.getElementById('progressFill').style.width = progress + '%';
}

function finishPractice() {
  if (timerInterval) clearInterval(timerInterval);
  if (!startTime) startTime = Date.now();
  const elapsed = (Date.now() - startTime) / 1000;
  const minutes = elapsed / 60 || 1;
  let correct = 0, errors = 0, typed = 0;
  for (let i = 0; i < charStatus.length; i++) {
    if (charStatus[i] === 'correct') { correct++; typed++; }
    else if (charStatus[i] === 'incorrect') { errors++; typed++; }
  }
  const cpm = Math.round(typed / minutes);
  const wpm = Math.round(correct / 5 / minutes);
  const acc = typed > 0 ? Math.round((correct / typed) * 100) : 100;
  const key = 'codetype_best_' + currentTitle;
  const best = JSON.parse(localStorage.getItem(key) || '{"cpm":0}');
  const isNewRecord = cpm > best.cpm;
  if (isNewRecord) localStorage.setItem(key, JSON.stringify({ cpm, wpm, acc }));
  document.getElementById('resTime').textContent = Math.round(elapsed) + 's';
  document.getElementById('resCpm').textContent = cpm;
  document.getElementById('resWpm').textContent = wpm;
  document.getElementById('resAcc').textContent = acc + '%';
  document.getElementById('newRecord').style.display = isNewRecord ? 'block' : 'none';
  document.getElementById('resultModal').classList.add('show');
  // 保存历史记录
  if (currentSnippetId >= 0) {
    const record = { snippetId: currentSnippetId, name: currentTitle, wpm, cpm, acc, errors, time: Math.round(elapsed), date: Date.now() };
    saveHistory(record);
    saveBest(currentSnippetId, record);
    renderProgress();
    renderStats();
  }
}

function closeModal() { document.getElementById('resultModal').classList.remove('show'); }
function goHome() {
  if (timerInterval) clearInterval(timerInterval);
  isComposing = false;
  document.getElementById('hiddenInput').value = '';
  document.getElementById('practiceView').style.display = 'none';
  document.getElementById('selectView').style.display = 'block';
  closeModal();
}
function toggleKeyboard() {
  keyboardCollapsed = !keyboardCollapsed;
  const kb = document.getElementById('keyboardWrapper');
  kb.classList.toggle('collapsed', keyboardCollapsed);
  if (keyboardCollapsed) {
    // 收起时清除内联transform，让CSS的collapsed动画生效
    kb.style.transform = '';
  } else {
    // 展开时如果已拖动过位置，保持transform: none
    const kbPos = JSON.parse(localStorage.getItem('codetype_kb_pos') || 'null');
    if (kbPos) kb.style.transform = 'none';
  }
  if (document.getElementById('practiceView').style.display !== 'none') {
    setTimeout(focusInput, 300);
  }
}


// 键盘拖动功能（通过收起按钮拖动，点击收起）
(function() {
  const kb = document.getElementById('keyboardWrapper');
  const toggle = document.querySelector('.keyboard-toggle');
  if (!kb || !toggle) return;
  let isDragging = false, hasMoved = false, startX, startY, startLeft, startTop;
  let kbPos = JSON.parse(localStorage.getItem('codetype_kb_pos') || 'null');

  // 恢复保存的位置
  if (kbPos) {
    kb.style.left = kbPos.left + 'px';
    kb.style.top = kbPos.top + 'px';
    kb.style.bottom = 'auto';
    kb.style.transform = 'none';
  }

  toggle.addEventListener('mousedown', function(e) {
    isDragging = true;
    hasMoved = false;
    startX = e.clientX;
    startY = e.clientY;
    const rect = kb.getBoundingClientRect();
    startLeft = rect.left;
    startTop = rect.top;
    kb.style.transition = 'none';
    toggle.style.cursor = 'grabbing';
    e.preventDefault();
    e.stopPropagation();
  });

  document.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) hasMoved = true;
    if (!hasMoved) return;
    let newLeft = startLeft + dx;
    let newTop = startTop + dy;
    const maxLeft = window.innerWidth - kb.offsetWidth;
    const maxTop = window.innerHeight - kb.offsetHeight;
    newLeft = Math.max(0, Math.min(newLeft, maxLeft));
    newTop = Math.max(0, Math.min(newTop, maxTop));
    kb.style.left = newLeft + 'px';
    kb.style.top = newTop + 'px';
    kb.style.bottom = 'auto';
    kb.style.transform = 'none';
  });

  document.addEventListener('mouseup', function(e) {
    if (!isDragging) return;
    isDragging = false;
    toggle.style.cursor = 'grab';
    kb.style.transition = '';
    if (hasMoved) {
      // 拖动结束，保存位置
      const rect = kb.getBoundingClientRect();
      localStorage.setItem('codetype_kb_pos', JSON.stringify({left: rect.left, top: rect.top}));
    } else {
      // 点击，执行收起/展开
      toggleKeyboard();
    }
    e.preventDefault();
    e.stopPropagation();
  });
})();

init();

</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeType - 算法代码打字练习</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== 墨主题（暗色）===== */
:root, [data-theme="ink"] {
  --bg: #0f0f12; --bg2: #18181d; --bg3: #22222a; --border: #2e2e38;
  --text: #e8e6e3; --text2: #9a9894; --text3: #5c5a56;
  --green: #69db7c; --red: #ff6b6b; --yellow: #ffd43b; --blue: #74c0fc; --blue2: #1c7ed6;
  --kw: #ff8787; --str: #69db7c; --num: #74c0fc; --fn: #da77f2; --ty: #ffa94d; --cm: #6c757d;
}
/* ===== 纸主题（亮色）===== */
[data-theme="paper"] {
  --bg: #f3ede4; --bg2: #fbf7f0; --bg3: #e8e0d4; --border: #d4c9b8;
  --text: #2b2825; --text2: #6b6560; --text3: #a09890;
  --green: #2f9e44; --red: #e03131; --yellow: #f08c00; --blue: #1971c2; --blue2: #1864ab;
  --kw: #c92a2a; --str: #2b8a3e; --num: #1864ab; --fn: #862e9c; --ty: #d9480f; --cm: #868e96;
}
[data-theme="paper"] .key.active { background: #862e9c; border-color: #862e9c; box-shadow: 0 0 8px #862e9c, 0 0 16px rgba(134,46,156,0.5); }
[data-theme="paper"] .key.shift-active { background: #9c36b5; border-color: #9c36b5; box-shadow: 0 0 8px #9c36b5, 0 0 16px rgba(156,54,181,0.5); }
* { margin: 0; padding: 0; box-sizing: border-box; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
header { background: var(--bg); padding: 12px 12px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15); gap: 20px; }
#selectView, #practiceView { padding: 16px 8px; }
header .tabs { margin-bottom: 0; }
header h1 { font-size: 24px; font-weight: 800; letter-spacing: 2px; font-family: "JetBrains Mono", "Fira Code", monospace; background: linear-gradient(135deg, var(--blue), var(--fn)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
header h1 span { color: var(--blue); -webkit-text-fill-color: var(--blue); }

main { flex: 1; padding: 16px 12px; max-width: 1400px; margin: 0 auto; width: 100%; padding-bottom: 140px; }
.layout { display: flex; gap: 20px; align-items: flex-start; }
.sidebar-left { width: 170px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; position: sticky; top: 70px; }
.sidebar-right { width: 170px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; position: sticky; top: 70px; }
.main-content { flex: 1; min-width: 0; }
.tabs { display: inline-flex; gap: 4px; margin-bottom: 0; background: var(--bg3); border-radius: 24px; padding: 4px; }
.tab { padding: 8px 22px; cursor: pointer; border: 1px solid transparent; background: none; color: var(--text2); font-size: 14px; border-radius: 20px; transition: all 0.2s; }
.tab:hover { opacity: 0.8; }
.tab.active { border-color: var(--blue); color: var(--blue); font-weight: 500; background: transparent; }
.github-input { display: flex; gap: 8px; margin-bottom: 16px; }
.github-input input { flex: 1; padding: 10px 14px; background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 14px; }
.github-input input:focus { outline: none; border-color: var(--blue); }
.btn { padding: 7px 16px; background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
.btn:hover { border-color: var(--blue); color: var(--blue); }
.btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn.primary:hover { background: var(--blue2); border-color: var(--blue2); color: #fff; }
.btn.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
.btn.secondary:hover { border-color: var(--blue); color: var(--blue); }
.theme-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg3); color: var(--text); cursor: pointer; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.theme-btn:hover { border-color: var(--blue); color: var(--blue); transform: scale(1.05); }
.github-link { color: var(--text2); display: flex; align-items: center; transition: color 0.2s; }
.github-link:hover { color: var(--text); }
.history-list { margin-top: 8px; }
.history-item { padding: 8px 12px; background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 4px; cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
.history-item:hover { border-color: var(--blue); }
.lang-filter { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.lang-tag { padding: 4px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; background: var(--bg3); border: 1px solid var(--border); color: var(--text2); }
.lang-tag.active { background: var(--blue2); color: #fff; border-color: var(--blue2); }
.snippet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.snippet-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; cursor: pointer; transition: border-color 0.2s; }
.snippet-card:hover { border-color: var(--blue); }
.snippet-card .lang-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-bottom: 8px; }
.lang-rust { background: #dea584; color: #000; }
.lang-c { background: #555555; color: #fff; }
.lang-python { background: #3572A5; color: #fff; }
.snippet-card h3 { font-size: 14px; margin-bottom: 4px; }
.snippet-card .meta { font-size: 12px; color: var(--text2); }
.filter-section { margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
.filter-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.filter-label { font-size: 13px; color: var(--text2); min-width: 36px; }
.filter-tags { display: inline-flex; gap: 4px; background: var(--bg3); border-radius: 20px; padding: 3px; flex-wrap: wrap; }
.filter-tag { padding: 5px 14px; border-radius: 16px; font-size: 12px; cursor: pointer; background: transparent; border: 1px solid transparent; color: var(--text); transition: all 0.2s; }
.filter-tag:hover { opacity: 0.8; }
.filter-tag.active { border-color: var(--blue); color: var(--blue); background: transparent; }

.progress-section { background: transparent; border: none; padding: 0; }
.progress-section::before { content: "学习任务"; display: block; font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 14px; letter-spacing: 2px; text-transform: uppercase; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
.progress-overview { display: flex; flex-direction: column; gap: 6px; }
.progress-item { display: flex; justify-content: space-between; font-size: 13px; }
.progress-label { color: var(--text2); }
.progress-value { color: var(--text); font-family: 'JetBrains Mono', monospace; font-weight: 600; }
.progress-track { height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
.progress-track.small { height: 4px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--blue), var(--green)); border-radius: 3px; transition: width 0.5s; }
.snippet-card.completed { border-color: var(--green); }
.snippet-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.diff-badge { font-size: 10px; padding: 2px 8px; border-radius: 4px; border: 1px solid; font-weight: 600; }
.done-badge { margin-left: auto; color: var(--green); font-weight: 700; font-size: 16px; }
.best-info { font-size: 11px; color: var(--yellow); margin-top: 6px; font-family: 'JetBrains Mono', monospace; }
.stats-section { background: transparent; border: none; padding: 0; }
.stats-title { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 10px; letter-spacing: 0.5px; }
.stat-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--bg3); }
.stat-item:last-child { border-bottom: none; }
.stat-item .stat-label { font-size: 11px; color: var(--text2); }
.stat-item .stat-value { font-size: 13px; font-weight: 600; color: var(--text); font-family: 'JetBrains Mono', monospace; }
.stat-item .stat-value.accent { color: var(--blue); }
.best-info { font-size: 11px; color: var(--yellow); margin-top: 6px; font-family: 'JetBrains Mono', monospace; }
.file-item { padding: 8px 16px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
.file-item:hover { background: var(--bg3); }
.folder-item { font-weight: 500; }
.folder-item .arrow { display: inline-block; width: 16px; transition: transform 0.2s; }
.folder-item.expanded .arrow { transform: rotate(90deg); }
.error-msg { background: rgba(248,81,73,0.1); border: 1px solid var(--red); color: var(--red); padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; }
.loading { text-align: center; padding: 40px; color: var(--text2); }
.search-box { margin-bottom: 12px; }
.search-box input { width: 100%; padding: 8px 12px; background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; }
.search-box input:focus { outline: none; border-color: var(--blue); }
.practice-layout { display: flex; gap: 20px; align-items: flex-start; }
.practice-sidebar { width: 170px; flex-shrink: 0; position: sticky; top: 70px; display: flex; flex-direction: column; gap: 12px; }
.practice-main { flex: 1; min-width: 0; }
.stats-bar { display: flex; flex-direction: column; gap: 12px; background: transparent; border: none; padding: 0; }
.stats-bar .stat { text-align: left; display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--bg3); }
.stats-bar .stat .label { font-size: 13px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; }
.stats-bar .stat .value { font-size: 16px; font-weight: 600; color: var(--blue); font-family: 'JetBrains Mono', monospace; }
.stats-bar .stat:first-child .value { font-size: 24px; color: var(--green); }
.progress-bar { flex: 1; min-width: 100px; }
.progress-track { height: 8px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--green); transition: width 0.3s; }
.code-wrapper { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; overflow-y: hidden; overflow-x: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.15); position: relative; }
.code-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.code-title { font-size: 13px; color: var(--text2); font-family: "JetBrains Mono", monospace; }
.back-btn { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; font-size: 14px; }
.back-btn:hover { border-color: var(--blue); color: var(--blue); }
.code-scroll { max-height: 62vh; overflow-y: auto; overflow-x: visible; padding: 24px 28px; font-family: 'JetBrains Mono', 'Fira Code', 'PingFang SC', 'Microsoft YaHei', monospace; font-size: 15px; line-height: 1.9; font-variant-ligatures: none; position: relative; scroll-behavior: smooth; letter-spacing: 0.2px; width: max-content; min-width: 100%; box-sizing: border-box; }
.code-scroll::-webkit-scrollbar { width: 6px; }
.code-scroll::-webkit-scrollbar-track { background: transparent; }
.code-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.code-scroll::-webkit-scrollbar-thumb:hover { background: var(--text3); }
.code-line { display: flex; }
.line-num { color: var(--text3); text-align: right; padding-right: 20px; user-select: none; min-width: 40px; flex-shrink: 0; }
.line-content { white-space: pre; flex: 1; }
.line-content.current-line { background: rgba(122,162,247,0.06); border-radius: 3px; }
.char { position: relative; }
.char.correct { border-bottom: 2px solid rgba(158,206,106,0.4); font-weight: 500; }
.char.incorrect { color: var(--red) !important; background: rgba(247,118,142,0.2); text-decoration: underline; text-decoration-color: var(--red); border-radius: 2px; font-weight: 600; }
.char.pending { color: var(--text2) !important; }
.char.pending.t-keyword { color: var(--kw) !important; opacity: 0.7; }
.char.pending.t-string { color: var(--str) !important; opacity: 0.7; }
.char.pending.t-number { color: var(--num) !important; opacity: 0.7; }
.char.pending.t-function { color: var(--fn) !important; opacity: 0.7; }
.char.pending.t-type { color: var(--ty) !important; opacity: 0.7; }
.char.pending.t-comment { color: var(--cm) !important; opacity: 0.8; }
.char.current { background: var(--blue); color: #fff !important; border-radius: 2px; animation: blink 1.2s infinite; font-weight: 600; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.75} }
.char.space { opacity: 0.5; }
.char.skip { color: var(--cm) !important; font-style: italic; opacity: 0.75; }
.t-keyword { color: var(--kw); font-weight: 600; }
.t-string { color: var(--str); }
.t-number { color: var(--num); font-weight: 500; }
.t-function { color: var(--fn); }
.t-type { color: var(--ty); font-weight: 500; }
.t-comment { color: var(--cm); font-style: italic; }
.t-code { color: var(--text); }
.char.correct.t-keyword { color: var(--kw); }
.char.correct.t-string { color: var(--str); }
.char.correct.t-number { color: var(--num); }
.char.correct.t-function { color: var(--fn); }
.char.correct.t-type { color: var(--ty); }
.char.correct.t-code { color: var(--text); }
.hidden-input { position: absolute; left: -9999px; opacity: 0; }
.actions { display: flex; gap: 8px; margin-bottom: 16px; }
.keyboard-wrapper { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--bg2); border-radius: 12px; padding: 14px 18px 16px; z-index: 50; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 8px 32px rgba(0,0,0,0.25); border: 1px solid var(--border); }
.keyboard-wrapper.collapsed { transform: translateY(calc(100% - 32px)); }
.keyboard-toggle { position: absolute; top: -24px; left: 50%; transform: translateX(-50%); background: var(--bg2); border: 1px solid var(--border); border-bottom: none; padding: 3px 12px; border-radius: 6px 6px 0 0; cursor: grab; font-size: 11px; color: var(--text2); transition: color 0.2s; box-shadow: 0 -2px 8px rgba(0,0,0,0.1); user-select: none; }
.keyboard-toggle:hover { color: var(--blue); }
.keyboard { display: flex; flex-direction: column; gap: 5px; max-width: 820px; margin: 0 auto; overflow-x: auto; min-width: 600px; }
.kb-row { display: flex; gap: 5px; justify-content: center; }
.key { min-width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 13px; font-weight: 500; font-family: 'JetBrains Mono', monospace; border: 1px solid var(--border); background: var(--bg3); color: var(--text); transition: all 0.1s; }
.key.wide { min-width: 56px; } .key.xwide { min-width: 76px; } .key.space { min-width: 240px; }
.key.active { background: var(--blue); color: #fff; border-color: var(--blue); transform: scale(0.94); box-shadow: 0 0 8px var(--blue), 0 0 16px var(--blue); font-weight: 600; }
.key.shift-active { background: var(--fn); color: #fff; border-color: var(--fn); transform: scale(0.94); box-shadow: 0 0 8px var(--fn), 0 0 16px var(--fn); font-weight: 600; }

.f-lp { background: #1a2a3a; color: #74c0fc; } .f-lr { background: #1a2e1a; color: #69db7c; } .f-lm { background: #2e2a1a; color: #ffd43b; } .f-li { background: #2a1a2e; color: #da77f2; } .f-ri { background: #2e1f1a; color: #ffa94d; } .f-rm { background: #2e2a1a; color: #ffd43b; } .f-rr { background: #1a2e1a; color: #69db7c; } .f-rp { background: #1a2a3a; color: #74c0fc; } .f-thumb { background: #2e1a1a; color: #ff8787; }
[data-theme="paper"] .f-lp { background: #e7f5ff; color: #1864ab; } [data-theme="paper"] .f-lr { background: #f0fff4; color: #2b8a3e; } [data-theme="paper"] .f-lm { background: #fff9db; color: #e67700; } [data-theme="paper"] .f-li { background: #f8f0fc; color: #862e9c; } [data-theme="paper"] .f-ri { background: #fff4e6; color: #d9480f; } [data-theme="paper"] .f-rm { background: #fff9db; color: #e67700; } [data-theme="paper"] .f-rr { background: #f0fff4; color: #2b8a3e; } [data-theme="paper"] .f-rp { background: #e7f5ff; color: #1864ab; } [data-theme="paper"] .f-thumb { background: #fff5f5; color: #c92a2a; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 32px; max-width: 400px; width: 90%; text-align: center; }
.modal h2 { margin-bottom: 16px; color: var(--green); }
.modal .big-wpm { font-size: 64px; font-weight: 700; color: var(--blue); font-family: 'JetBrains Mono', monospace; margin-bottom: 8px; }
.modal .big-wpm-label { font-size: 12px; color: var(--text2); margin-bottom: 20px; }
.result-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 24px; }
.result-item .label { font-size: 11px; color: var(--text2); text-transform: uppercase; }
.result-item .value { font-size: 20px; font-weight: 700; color: var(--text); font-family: 'JetBrains Mono', monospace; }
.new-record { color: var(--yellow); font-size: 14px; margin-bottom: 16px; }
.hint { font-size: 12px; color: var(--text2); margin-bottom: 8px; }
</style>
</head>
<body>
<header>
  <h1><span>CodeType</span></h1>
  <div class="tabs" id="mainTabs">
    <button class="tab active" onclick="switchTab('examples',this)">算法题库</button>
    <button class="tab" onclick="switchTab('github',this)">GitHub 仓库</button>
  </div>
  <div style="display:flex;gap:12px;align-items:center">
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">墨</button>
    <a href="https://github.com/purejoy415" target="_blank" class="github-link" title="作者 GitHub">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
    </a>
  </div>
</header>
<main>
  <div id="selectView">
    <div id="examplesTab">
      <div class="layout">
        <div class="sidebar-left">
          <div class="stats-section" id="statsPanel">
            <div class="stats-title">打字数据</div>
            <div class="stat-item"><span class="stat-label">今日练习</span><span class="stat-value accent" id="statToday">0</span></div>
            <div class="stat-item"><span class="stat-label">本周练习</span><span class="stat-value accent" id="statWeek">0</span></div>
            <div class="stat-item"><span class="stat-label">总练习次数</span><span class="stat-value" id="statCount">0</span></div>
            <div class="stat-item"><span class="stat-label">总字符数</span><span class="stat-value" id="statChars">0</span></div>
            <div class="stat-item"><span class="stat-label">总用时</span><span class="stat-value" id="statTime">0分</span></div>
            <div class="stat-item"><span class="stat-label">平均CPM</span><span class="stat-value accent" id="statAvgCpm">0</span></div>
            <div class="stat-item"><span class="stat-label">平均准确率</span><span class="stat-value accent" id="statAvgAcc">0%</span></div>
            <div class="stat-item"><span class="stat-label">最高CPM</span><span class="stat-value accent" id="statMaxCpm">0</span></div>
            <div class="stat-item"><span class="stat-label">总错误数</span><span class="stat-value" id="statErrors">0</span></div>
            <div class="stat-item"><span class="stat-label">连续天数</span><span class="stat-value accent" id="statStreak">0天</span></div>
          </div>
        </div>
        <div class="main-content">

// 平均查找/插入/删除O(log n)，中序遍历得到有序序列
use std::cell::RefCell;
use std::rc::Rc;
type NodeRef = Rc<RefCell<BSTNode>>;
struct BSTNode { val: i32, left: Option<NodeRef>, right: Option<NodeRef> }
struct BST { root: Option<NodeRef> }
impl BST {
    fn new() -> Self { BST { root: None } }
    // 插入：递归找到合适的空位置
    fn insert(&mut self, val: i32) {
        fn insert_node(node: &mut Option<NodeRef>, val: i32) {
            match node {
                None => *node = Some(Rc::new(RefCell::new(BSTNode { val, left: None, right: None }))),
                Some(n) => {
                    let mut n = n.borrow_mut();
                    if val < n.val { insert_node(&mut n.left, val); }
                    else if val > n.val { insert_node(&mut n.right, val); }
                }
            }
        }
        insert_node(&mut self.root, val);
    }
    // 中序遍历：左->根->右，结果升序
    fn inorder(&self) -> Vec<i32> {
        fn traverse(node: &Option<NodeRef>, result: &mut Vec<i32>) {
            if let Some(n) = node {
                let n = n.borrow();
                traverse(&n.left, result);
                result.push(n.val);
                traverse(&n.right, result);
            }
        }
        let mut result = Vec::new();
        traverse(&self.root, &mut result);
        result
    }

  { id: 12, category: 'ds', difficulty: 'medium', lang: 'rust', name: '二叉堆', code: `// 二叉堆：完全二叉树，用数组存储
// 大顶堆：父节点>=子节点，堆顶是最大值
// 插入O(log n)，弹出堆顶O(log n)，建堆O(n)
struct MaxHeap { data: Vec<i32> }
impl MaxHeap {
    fn new() -> Self { MaxHeap { data: Vec::new() } }
    // 插入：末尾添加，向上调整（与父节点比较交换）
    fn push(&mut self, val: i32) {
        self.data.push(val);
        let mut i = self.data.len() - 1;
        while i > 0 {
            let parent = (i - 1) / 2;
            if self.data[i] > self.data[parent] {
                self.data.swap(i, parent);
                i = parent;
            } else { break; }
        }
    }
    // 弹出最大值：堆顶与末尾交换，弹出末尾，向下调整
    fn pop(&mut self) -> Option<i32> {
        if self.data.is_empty() { return None; }
        let max = self.data.swap_remove(0);
        let mut i = 0;
        loop {
            let left = 2 * i + 1;
            let right = 2 * i + 2;
            let mut largest = i;
            if left < self.data.len() && self.data[left] > self.data[largest] { largest = left; }
            if right < self.data.len() && self.data[right] > self.data[largest] { largest = right; }
            if largest == i { break; }
            self.data.swap(i, largest);
            i = largest;
        }
        Some(max)
    }

  { id: 14, category: 'ds', difficulty: 'medium', lang: 'rust', name: '并查集', code: `// 并查集(Union-Find)：管理不相交集合，支持合并和查询
// 路径压缩+按秩合并，操作近似O(1)
// 常用于：连通性判断、最小生成树、动态连通性
struct UnionFind { parent: Vec<usize>, rank: Vec<usize> }
impl UnionFind {
    fn new(n: usize) -> Self {
        UnionFind { parent: (0..n).collect(), rank: vec![0; n] }
    }
    // 查找根（带路径压缩：递归时直接指向根）
    fn find(&mut self, x: usize) -> usize {
        if self.parent[x] != x {
            self.parent[x] = self.find(self.parent[x]);
        }
        self.parent[x]
    }
    // 合并（按秩合并：小树挂到大树下）
    fn union(&mut self, x: usize, y: usize) -> bool {
        let rx = self.find(x);
        let ry = self.find(y);
        if rx == ry { return false; } // 已在同一集合
        if self.rank[rx] < self.rank[ry] {
            self.parent[rx] = ry;
        } else {
            self.parent[ry] = rx;
            if self.rank[rx] == self.rank[ry] { self.rank[rx] += 1; }
        }
        true
    }
    fn connected(&mut self, x: usize, y: usize) -> bool {
        self.find(x) == self.find(y)
    }
}

    fn search(&self, word: &str) -> bool {

    }

// 常用于：下一个更大元素、柱状图最大矩形、每日温度
// 每个元素最多入栈出栈一次，O(n)时间
fn next_greater_element(nums: &[i32]) -> Vec<i32> {
    let n = nums.len();
    let mut result = vec![-1; n];
    let mut stack: Vec<usize> = Vec::new(); // 存下标，栈内对应值单调递减
    for i in 0..n {
        // 当前元素比栈顶大，弹出并记录答案
        while let Some(&top) = stack.last() {
            if nums[i] > nums[top] {
                result[top] = nums[i];
                stack.pop();
            } else { break; }
        }
        stack.push(i);
    }
    result
}
fn main() {

use std::collections::VecDeque;
fn max_sliding_window(nums: &[i32], k: usize) -> Vec<i32> {
    let mut result = Vec::new();
    let mut deque: VecDeque<usize> = VecDeque::new(); // 存下标，对应值单调递减
    for i in 0..nums.len() {
        // 移除超出窗口的队首
        if let Some(&front) = deque.front() {
            if front + k <= i { deque.pop_front(); }
        }
        // 移除队尾比当前小的（它们不可能成为最大值）
        while let Some(&back) = deque.back() {
            if nums[back] <= nums[i] { deque.pop_back(); } else { break; }
        }
        deque.push_back(i);
        // 窗口形成后记录答案
        if i >= k - 1 {
            result.push(nums[*deque.front().unwrap()]);
        }
    }
    result

  { id: 18, category: 'ds', difficulty: 'medium', lang: 'rust', name: '环形缓冲区', code: `// 环形缓冲区(Circular Buffer)：固定大小的循环队列
// 用数组+读写指针实现，读写O(1)，适合生产者消费者模式
struct CircularBuffer<T: Clone + Default> { data: Vec<T>, head: usize, tail: usize, size: usize, capacity: usize }
impl<T: Clone + Default> CircularBuffer<T> {
    fn new(capacity: usize) -> Self {
        CircularBuffer { data: vec![T::default(); capacity], head: 0, tail: 0, size: 0, capacity }
    }
    // 写入：tail位置写入，tail后移（取模循环）
    fn write(&mut self, item: T) -> bool {
        if self.size == self.capacity { return false; } // 满了
        self.data[self.tail] = item;
        self.tail = (self.tail + 1) % self.capacity;
        self.size += 1;
        true
    }
    // 读取：head位置读取，head后移
    fn read(&mut self) -> Option<T> {
        if self.size == 0 { return None; } // 空
        let item = self.data[self.head].clone();
        self.head = (self.head + 1) % self.capacity;
        self.size -= 1;
        Some(item)
    }
}
fn main() {
    let mut buf = CircularBuffer::new(3);
    buf.write(1); buf.write(2); buf.write(3);
    println!("write 4: {}", buf.write(4)); // false（满了）
    while let Some(v) = buf.read() { print!("{} ", v); } // 1 2 3
}` },

use std::cell::RefCell;
use std::rc::{Rc, Weak};
struct Node { val: i32, prev: Option<Weak<RefCell<Node>>>, next: Option<Rc<RefCell<Node>>> }
struct DoublyLinkedList { head: Option<Rc<RefCell<Node>>>, tail: Option<Rc<RefCell<Node>>> }
impl DoublyLinkedList {
    fn new() -> Self { DoublyLinkedList { head: None, tail: None } }

    fn push_back(&mut self, val: i32) {
        let new_node = Rc::new(RefCell::new(Node { val, prev: None, next: None }));
        match self.tail.take() {
            Some(old_tail) => {
                old_tail.borrow_mut().next = Some(new_node.clone());
                new_node.borrow_mut().prev = Some(Rc::downgrade(&old_tail));
                self.tail = Some(new_node);

                Some(next) => {
                    next.borrow_mut().prev = None;
                    self.head = Some(next);
                }
                None => { self.tail = None; }
            }
            val
        })
    }

  { id: 20, category: 'ds', difficulty: 'hard', lang: 'rust', name: 'AVL树', code: `// AVL树：自平衡二叉搜索树
// 每个节点左右子树高度差<=1，插入删除后旋转恢复平衡
// 查找/插入/删除O(log n)
use std::cmp::max;
struct AVLNode { val: i32, left: Option<Box<AVLNode>>, right: Option<Box<AVLNode>>, height: i32 }
impl AVLNode {
    fn new(val: i32) -> Box<Self> { Box::new(AVLNode { val, left: None, right: None, height: 1 }) }
    fn height(node: &Option<Box<AVLNode>>) -> i32 { node.as_ref().map_or(0, |n| n.height) }
    fn balance_factor(node: &Box<AVLNode>) -> i32 { Self::height(&node.left) - Self::height(&node.right) }
    fn update_height(node: &mut Box<AVLNode>) {
        node.height = 1 + max(Self::height(&node.left), Self::height(&node.right));
    }
    // 右旋：左子节点成为新根
    fn rotate_right(mut y: Box<AVLNode>) -> Box<AVLNode> {
        let mut x = y.left.take().unwrap();
        y.left = x.right.take();
        Self::update_height(&mut y);
        x.right = Some(y);
        Self::update_height(&mut x);
        x
    }
    // 左旋：右子节点成为新根
    fn rotate_left(mut x: Box<AVLNode>) -> Box<AVLNode> {
        let mut y = x.right.take().unwrap();
        x.right = y.left.take();
        Self::update_height(&mut x);
        y.left = Some(x);
        Self::update_height(&mut y);
        y
    }
    fn insert(node: Option<Box<AVLNode>>, val: i32) -> Box<AVLNode> {
        let mut node = match node {
            None => return Self::new(val),
            Some(n) => n,
        };
        if val < node.val { node.left = Some(Self::insert(node.left.take(), val)); }
        else if val > node.val { node.right = Some(Self::insert(node.right.take(), val)); }
        else { return node; }
        Self::update_height(&mut node);
        let bf = Self::balance_factor(&node);
        // 左左情况：右旋
        if bf > 1 && val < node.left.as_ref().unwrap().val { return Self::rotate_right(node); }
        // 右右情况：左旋
        if bf < -1 && val > node.right.as_ref().unwrap().val { return Self::rotate_left(node); }
        // 左右情况：先左旋再右旋
        if bf > 1 && val > node.left.as_ref().unwrap().val {
            node.left = Some(Self::rotate_left(node.left.take().unwrap()));
            return Self::rotate_right(node);
        }
        // 右左情况：先右旋再左旋
        if bf < -1 && val < node.right.as_ref().unwrap().val {
            node.right = Some(Self::rotate_right(node.right.take().unwrap()));
            return Self::rotate_left(node);
        }
        node
    }
}
fn main() {

  { id: 21, category: 'ds', difficulty: 'hard', lang: 'rust', name: '线段树', code: `// 线段树：将区间分成二叉树节点，支持区间查询和单点更新
// 每个节点代表一个区间，存储区间的聚合信息（和、最大值等）
// 构建O(n)，查询/更新O(log n)
struct SegmentTree { tree: Vec<i32>, n: usize }
impl SegmentTree {
    // 构建：叶子是原数组，内部节点是子节点的和
    fn build(arr: &[i32]) -> Self {
        let n = arr.len();
        let mut tree = vec![0; 4 * n];
        fn build(node: usize, start: usize, end: usize, arr: &[i32], tree: &mut Vec<i32>) {
            if start == end { tree[node] = arr[start]; return; }
            let mid = (start + end) / 2;
            build(2 * node, start, mid, arr, tree);
            build(2 * node + 1, mid + 1, end, arr, tree);
            tree[node] = tree[2 * node] + tree[2 * node + 1];
        }
        build(1, 0, n - 1, arr, &mut tree);
        SegmentTree { tree, n }
    }
    // 区间查询[l, r]的和
    fn query(&self, l: usize, r: usize) -> i32 {
        fn q(node: usize, start: usize, end: usize, l: usize, r: usize, tree: &[i32]) -> i32 {
            if r < start || end < l { return 0; } // 完全不重叠
            if l <= start && end <= r { return tree[node]; } // 完全包含
            let mid = (start + end) / 2;
            q(2 * node, start, mid, l, r, tree) + q(2 * node + 1, mid + 1, end, l, r, tree)
        }
        q(1, 0, self.n - 1, l, r, &self.tree)
    }
    // 单点更新
    fn update(&mut self, idx: usize, val: i32) {
        fn u(node: usize, start: usize, end: usize, idx: usize, val: i32, tree: &mut Vec<i32>) {
            if start == end { tree[node] = val; return; }
            let mid = (start + end) / 2;
            if idx <= mid { u(2 * node, start, mid, idx, val, tree); }
            else { u(2 * node + 1, mid + 1, end, idx, val, tree); }
            tree[node] = tree[2 * node] + tree[2 * node + 1];
        }
        u(1, 0, self.n - 1, idx, val, &mut self.tree);
    }
}
fn main() {
    let arr = [1, 3, 5, 7, 9, 11];
    let st = SegmentTree::build(&arr);
    println!("sum[1..3] = {}", st.query(1, 3)); // 3+5+7=15
}` },
  { id: 22, category: 'ds', difficulty: 'hard', lang: 'rust', name: '树状数组', code: `// 树状数组(Fenwick Tree)：支持前缀和查询和单点更新
// 比线段树更简洁，空间O(n)，操作O(log n)
// 利用lowbit(x)=x&(-x)管理父子关系
struct FenwickTree { tree: Vec<i32> }
impl FenwickTree {
    fn new(n: usize) -> Self { FenwickTree { tree: vec![0; n + 1] } }
    // 单点更新：idx位置加delta，向上更新所有父节点
    fn update(&mut self, mut idx: usize, delta: i32) {
        while idx < self.tree.len() {
            self.tree[idx] += delta;
            idx += idx & idx.wrapping_neg(); // lowbit
        }
    }
    // 前缀和：sum[1..idx]，向下累加
    fn query(&self, mut idx: usize) -> i32 {
        let mut sum = 0;
        while idx > 0 {
            sum += self.tree[idx];
            idx -= idx & idx.wrapping_neg(); // lowbit
        }
        sum
    }
    // 区间和[l, r] = prefix(r) - prefix(l-1)
    fn range_query(&self, l: usize, r: usize) -> i32 {
        self.query(r) - self.query(l - 1)
    }
}
fn main() {
    let mut ft = FenwickTree::new(5);
    for i in 1..=5 { ft.update(i, i as i32); } // [1,2,3,4,5]
    println!("prefix(3) = {}", ft.query(3)); // 1+2+3=6
    println!("range(2,4) = {}", ft.range_query(2, 4)); // 2+3+4=9
}` },
  { id: 23, category: 'ds', difficulty: 'hard', lang: 'rust', name: '跳表', code: `// 跳表(Skip List)：有序链表的多层索引结构
// 每层是下层的子集，通过随机层数实现平衡
// 平均查找/插入/删除O(log n)，Redis的ZSET底层实现
use rand::Rng;
struct SkipListNode { val: i32, forward: Vec<Option<usize>> }
struct SkipList { nodes: Vec<SkipListNode>, head: usize, max_level: usize }
impl SkipList {
    fn new() -> Self {
        let head = SkipListNode { val: i32::MIN, forward: vec![None; 32] };
        SkipList { nodes: vec![head], head: 0, max_level: 1 }
    }
    // 随机层数：概率1/2升一层
    fn random_level() -> usize {
        let mut level = 1;
        let mut rng = rand::thread_rng();
        while rng.gen::<bool>() && level < 32 { level += 1; }
        level
    }
    // 插入：找到每层前驱，创建新节点，更新指针
    fn insert(&mut self, val: i32) {
        let mut update = vec![0; 32];
        let mut current = self.head;
        // 从最高层向下找前驱
        for level in (0..self.max_level).rev() {
            while let Some(next) = self.nodes[current].forward[level] {
                if self.nodes[next].val < val { current = next; } else { break; }
            }
            update[level] = current;
        }
        let new_level = Self::random_level();
        if new_level > self.max_level {
            for level in self.max_level..new_level { update[level] = self.head; }
            self.max_level = new_level;
        }
        let new_idx = self.nodes.len();
        self.nodes.push(SkipListNode { val, forward: vec![None; new_level] });
        // 更新每层指针
        for level in 0..new_level {
            self.nodes[new_idx].forward[level] = self.nodes[update[level]].forward[level];
            self.nodes[update[level]].forward[level] = Some(new_idx);
        }
    }
    fn search(&self, val: i32) -> bool {
        let mut current = self.head;
        for level in (0..self.max_level).rev() {
            while let Some(next) = self.nodes[current].forward[level] {
                if self.nodes[next].val < val { current = next; } else { break; }
            }
        }
        if let Some(next) = self.nodes[current].forward[0] {
            return self.nodes[next].val == val;
        }
        false
    }
}
fn main() {
    let mut sl = SkipList::new();
    for v in [3, 7, 1, 9, 5] { sl.insert(v); }
    println!("search 5: {}", sl.search(5)); // true
    println!("search 10: {}", sl.search(10)); // false
}` },
  { id: 24, category: 'ds', difficulty: 'hard', lang: 'rust', name: 'LRU缓存', code: `// LRU缓存：最近最少使用淘汰策略
// 哈希表+双向链表，get/put都是O(1)
// 哈希表存key->节点，链表维护使用顺序（头部最近使用，尾部最久未使用）
use std::cell::RefCell;
use std::collections::HashMap;
use std::rc::{Rc, Weak};
struct Node { key: i32, val: i32, prev: Option<Weak<RefCell<Node>>>, next: Option<Rc<RefCell<Node>>> }
struct LRUCache { capacity: usize, map: HashMap<i32, Rc<RefCell<Node>>>, head: Option<Rc<RefCell<Node>>>, tail: Option<Rc<RefCell<Node>>> }
impl LRUCache {
    fn new(capacity: usize) -> Self {
        LRUCache { capacity, map: HashMap::new(), head: None, tail: None }
    }
    // 移到头部（最近使用）
    fn move_to_head(&mut self, node: Rc<RefCell<Node>>) {
        self.remove_node(node.clone());
        self.add_to_head(node);
    }
    fn remove_node(&mut self, node: Rc<RefCell<Node>>) {
        let prev = node.borrow().prev.clone();
        let next = node.borrow().next.clone();
        if let Some(p) = prev.clone().and_then(|w| w.upgrade()) { p.borrow_mut().next = next.clone(); }
        if let Some(n) = next { n.borrow_mut().prev = prev; }
        if Rc::ptr_eq(self.head.as_ref().unwrap(), &node) { self.head = next.clone(); }
        if self.tail.as_ref().map_or(false, |t| Rc::ptr_eq(t, &node)) { self.tail = prev.and_then(|w| w.upgrade()); }
    }
    fn add_to_head(&mut self, node: Rc<RefCell<Node>>) {
        node.borrow_mut().prev = None;
        node.borrow_mut().next = self.head.clone();
        if let Some(h) = &self.head { h.borrow_mut().prev = Some(Rc::downgrade(&node)); }
        self.head = Some(node.clone());
        if self.tail.is_none() { self.tail = Some(node); }
    }
    fn get(&mut self, key: i32) -> Option<i32> {
        if let Some(node) = self.map.get(&key).cloned() {
            let val = node.borrow().val;
            self.move_to_head(node);
            return Some(val);
        }
        None
    }
    fn put(&mut self, key: i32, val: i32) {
        if let Some(node) = self.map.get(&key).cloned() {
            node.borrow_mut().val = val;
            self.move_to_head(node);
        } else {
            if self.map.len() >= self.capacity {
                if let Some(tail) = self.tail.clone() {
                    let k = tail.borrow().key;
                    self.remove_node(tail);
                    self.map.remove(&k);
                }
            }
            let node = Rc::new(RefCell::new(Node { key, val, prev: None, next: None }));
            self.map.insert(key, node.clone());
            self.add_to_head(node);
        }
    }
}
fn main() {
    let mut cache = LRUCache::new(2);
    cache.put(1, 1); cache.put(2, 2);
    println!("get 1: {:?}", cache.get(1)); // Some(1)
    cache.put(3, 3); // 淘汰key=2
    println!("get 2: {:?}", cache.get(2)); // None
}` },
  { id: 25, category: 'ds', difficulty: 'hard', lang: 'rust', name: '布隆过滤器', code: `// 布隆过滤器：空间高效的概率型数据结构
// 判断元素"可能存在"或"一定不存在"，有误判率但无漏判
// 用位数组+多个哈希函数，插入置位，查询检查所有位
struct BloomFilter { bits: Vec<u8>, size: usize, hash_count: usize }
impl BloomFilter {
    fn new(size: usize, hash_count: usize) -> Self {
        BloomFilter { bits: vec![0; (size + 7) / 8], size, hash_count }
    }
    // 简单双哈希：用两个基础哈希生成多个哈希值
    fn hashes(&self, item: &str) -> Vec<usize> {
        let h1 = item.bytes().fold(0u64, |a, b| a.wrapping_mul(31).wrapping_add(b as u64));
        let h2 = item.bytes().fold(0u64, |a, b| a.wrapping_mul(17).wrapping_add(b as u64));
        (0..self.hash_count).map(|i| ((h1.wrapping_add((i as u64).wrapping_mul(h2))) % self.size as u64) as usize).collect()
    }
    // 插入：所有哈希位置1
    fn insert(&mut self, item: &str) {
        for pos in self.hashes(item) {
            self.bits[pos / 8] |= 1 << (pos % 8);
        }
    }
    // 查询：所有哈希位都为1才可能存在
    fn contains(&self, item: &str) -> bool {
        self.hashes(item).iter().all(|&pos| self.bits[pos / 8] & (1 << (pos % 8)) != 0)
    }
}
fn main() {
    let mut bf = BloomFilter::new(1000, 3);
    bf.insert("apple"); bf.insert("banana");
    println!("contains apple: {}", bf.contains("apple")); // true
    println!("contains cherry: {}", bf.contains("cherry")); // 可能false（大概率）
}` },
  { id: 26, category: 'ds', difficulty: 'hard', lang: 'rust', name: '后缀数组', code: `// 后缀数组：所有后缀按字典序排序后的起始下标数组
// 用于字符串匹配、最长公共前缀、不同子串计数等
// O(n log^2 n) 构建（倍增法）
fn build_suffix_array(s: &str) -> Vec<usize> {
    let n = s.len();
    let chars: Vec<char> = s.chars().collect();
    let mut sa: Vec<usize> = (0..n).collect();
    let mut rank: Vec<usize> = chars.iter().map(|&c| c as usize).collect();
    let mut k = 1;
    while k < n {
        // 按(rank[i], rank[i+k])双关键字排序
        sa.sort_by(|&a, &b| {
            let ra = (rank[a], if a + k < n { rank[a + k] } else { 0 });
            let rb = (rank[b], if b + k < n { rank[b + k] } else { 0 });
            ra.cmp(&rb)
        });

        let mut current = 0;
        for c in pattern.chars() {
            let next = self.nodes[current].children.get(&c).copied();
            current = match next {
                Some(idx) => idx,
                None => {
                    let idx = self.nodes.len();
                    self.nodes.push(ACNode { children: HashMap::new(), fail: 0, output: Vec::new() });

                }
            };

    fn build(&mut self) {
        let mut queue = VecDeque::new();

            queue.push_back(child);

                } else { 0 };
                // 合并输出
                let fail_output = self.nodes[self.nodes[v].fail].output.clone();

// 插入O(log n)，弹出O(log n)，建堆O(n)
struct MaxHeap<T: Ord> { data: Vec<T> }
impl<T: Ord> MaxHeap<T> {
    fn new() -> Self { MaxHeap { data: Vec::new() } }
    // 从数组建堆：从最后一个非叶子节点开始向下调整，O(n)
    fn from_vec(mut v: Vec<T>) -> Self {
        let n = v.len();
        for i in (0..n / 2).rev() {
            Self::sift_down(&mut v, i);
        }
        MaxHeap { data: v }
    }
    fn push(&mut self, item: T) {
        self.data.push(item);
        Self::sift_up(&mut self.data, self.data.len() - 1);
    }
    fn pop(&mut self) -> Option<T> {
        if self.data.is_empty() { return None; }
        let last = self.data.len() - 1;
        self.data.swap(0, last);
        let max = self.data.pop();
        Self::sift_down(&mut self.data, 0);
        max
    }
    // 向上调整：与父节点比较，大则交换
    fn sift_up(data: &mut Vec<T>, mut i: usize) {
        while i > 0 {
            let parent = (i - 1) / 2;
            if data[i] > data[parent] {
                data.swap(i, parent);
                i = parent;
            } else { break; }
        }
    }
    // 向下调整：与较大子节点交换
    fn sift_down(data: &mut Vec<T>, mut i: usize) {
        let n = data.len();
        loop {
            let left = 2 * i + 1;
            let right = 2 * i + 2;
            let mut largest = i;
            if left < n && data[left] > data[largest] { largest = left; }
            if right < n && data[right] > data[largest] { largest = right; }
            if largest == i { break; }
            data.swap(i, largest);
            i = largest;
        }
    }
    // 堆排序：不断弹出堆顶，得到升序序列
    fn heap_sort(mut arr: Vec<T>) -> Vec<T> {
        let mut heap = Self::from_vec(arr);
        let mut result = Vec::new();
        while let Some(v) = heap.pop() { result.push(v); }
        result.reverse();
        result
    }
}
fn main() {
    let sorted = MaxHeap::heap_sort(vec![5, 2, 8, 1, 9, 3]);
    println!("{:?}", sorted); // [1,2,3,5,8,9]
}` },

// 查找/插入/删除O(log n)，比AVL插入删除更快（旋转更少）

    fn rotate_left(mut h: Box<RBNode>) -> Box<RBNode> {
        let mut x = h.right.take().unwrap();
        h.right = x.left.take();
        x.left = Some(h);
        x.color = x.left.as_ref().unwrap().color;
        x.left.as_mut().unwrap().color = Color::Red;
        x
    }
    // 右旋
    fn rotate_right(mut h: Box<RBNode>) -> Box<RBNode> {
        let mut x = h.left.take().unwrap();
        h.left = x.right.take();
        x.right = Some(h);
        x.color = x.right.as_ref().unwrap().color;
        x.right.as_mut().unwrap().color = Color::Red;
        x
    }

    fn flip_colors(h: &mut Box<RBNode>) {

        if let Some(r) = &mut h.right { r.color = Color::Black; }

int partition(int arr[], int low, int high) {

    for (int j = low; j < high; j++) {

// 时间O(n log n)，空间O(n)，稳定排序
#include <stdio.h>
#include <stdlib.h>
// 合并两个有序子数组 arr[l..m] 和 arr[m+1..r]
void merge(int arr[], int l, int m, int r) {
    int n1 = m - l + 1, n2 = r - m;
    int *L = malloc(n1 * sizeof(int));
    int *R = malloc(n2 * sizeof(int));
    for (int i = 0; i < n1; i++) L[i] = arr[l + i];
    for (int j = 0; j < n2; j++) R[j] = arr[m + 1 + j];
    int i = 0, j = 0, k = l;
    // 双指针合并，小的先放
    while (i < n1 && j < n2) {
        if (L[i] <= R[j]) arr[k++] = L[i++];
        else arr[k++] = R[j++];
    }
    while (i < n1) arr[k++] = L[i++]; // 剩余元素
    while (j < n2) arr[k++] = R[j++];
    free(L); free(R);
}
void merge_sort(int arr[], int l, int r) {

        merge_sort(arr, l, m); // 递归排左
        merge_sort(arr, m + 1, r); // 递归排右
        merge(arr, l, m, r); // 合并

#include <stdio.h>
#include <string.h>
// 构建next数组：next[i]=pattern[0..i]的最长相等前后缀长度
void build_next(char *pattern, int m, int *next) {
    next[0] = 0;
    int len = 0; // 最长公共前后缀长度
    int i = 1;
    while (i < m) {
        if (pattern[i] == pattern[len]) {
            len++;
            next[i] = len;
            i++;
        } else {
            if (len != 0) {
                len = next[len - 1]; // 回溯到更短的前后缀
            } else {
                next[i] = 0;
                i++;
            }
        }
    }
}

void kmp_search(char *text, char *pattern) {
    int n = strlen(text), m = strlen(pattern);
    int next[m];

    int i = 0, j = 0; // i文本指针，j模式指针
    while (i < n) {
        if (text[i] == pattern[j]) {
            i++; j++;
            if (j == m) { // 完全匹配
                printf("Found at index %d\n", i - j);
                j = next[j - 1]; // 继续找下一个匹配
            }
        } else {
            if (j != 0) j = next[j - 1]; // 利用next数组不回溯i
            else i++;
        }
    }
}

// dp[i][w]=前i个物品容量w时的最大价值
// 时间O(nW)，空间可优化到O(W)
#include <stdio.h>
#include <string.h>
// 二维DP版
int knapsack_2d(int weights[], int values[], int n, int W) {
    int dp[n + 1][W + 1];
    memset(dp, 0, sizeof(dp));
    for (int i = 1; i <= n; i++) {
        for (int w = 0; w <= W; w++) {
            if (weights[i - 1] <= w) {
                // 状态转移：不选 vs 选（价值加，容量减）
                int not_take = dp[i - 1][w];
                int take = values[i - 1] + dp[i - 1][w - weights[i - 1]];
                dp[i][w] = not_take > take ? not_take : take;
            } else {
                dp[i][w] = dp[i - 1][w]; // 装不下，不选
            }
        }
    }
    return dp[n][W];
}
// 一维优化版：逆序遍历容量保证每个物品只用一次
int knapsack_1d(int weights[], int values[], int n, int W) {
    int dp[W + 1];
    memset(dp, 0, sizeof(dp));
    for (int i = 0; i < n; i++) {
        for (int w = W; w >= weights[i]; w--) { // 逆序！
            int take = values[i] + dp[w - weights[i]];
            dp[w] = dp[w] > take ? dp[w] : take;
        }
    }
    return dp[W];
}

    int values[] = {3, 4, 5, 6};

    int m = strlen(text1), n = strlen(text2);
    int dp[m + 1][n + 1];
    memset(dp, 0, sizeof(dp));
    for (int i = 1; i <= m; i++) {
        for (int j = 1; j <= n; j++) {
            if (text1[i - 1] == text2[j - 1]) {
                dp[i][j] = dp[i - 1][j - 1] + 1; // 字符相同，LCS+1
            } else {
                // 字符不同，取删text1或删text2的最大值
                dp[i][j] = dp[i - 1][j] > dp[i][j - 1] ? dp[i - 1][j] : dp[i][j - 1];

        }
    }

}

int dist[MAXN], visited[MAXN];

void dijkstra(int start, int n) {
    for (int i = 0; i < n; i++) { dist[i] = INF; visited[i] = 0; }
    dist[start] = 0;
    for (int count = 0; count < n - 1; count++) {

  { id: 49, category: 'algo', difficulty: 'medium', lang: 'c', name: '记忆化搜索', code: `// 记忆化搜索：DFS+缓存，避免重复计算子问题
// 本质是自顶向下的DP，适合状态转移复杂的问题
#include <stdio.h>
#include <string.h>
#define MAXN 100
int memo[MAXN]; // 缓存计算结果
// 斐波那契记忆化版：O(n)时间
int fib_memo(int n) {
    if (n <= 1) return n;
    if (memo[n] != -1) return memo[n]; // 已计算过直接返回
    memo[n] = fib_memo(n - 1) + fib_memo(n - 2); // 计算并缓存
    return memo[n];
}
// 矩阵链乘法：记忆化搜索求最少标量乘法次数
int dp_mcm[MAXN][MAXN];
int p[MAXN]; // 矩阵维度：p[i-1]x p[i]
int matrix_chain(int i, int j) {
    if (i == j) return 0; // 单个矩阵无需乘法
    if (dp_mcm[i][j] != -1) return dp_mcm[i][j];
    int min = INT_MAX;
    // 在k处分割：A[i..k] * A[k+1..j]
    for (int k = i; k < j; k++) {
        int cost = matrix_chain(i, k) + matrix_chain(k + 1, j) + p[i - 1] * p[k] * p[j];
        if (cost < min) min = cost;
    }
    dp_mcm[i][j] = min;
    return min;
}
int main() {
    memset(memo, -1, sizeof(memo));
    printf("fib(40) = %d\n", fib_memo(40)); // 102334155
    memset(dp_mcm, -1, sizeof(dp_mcm));
    p[0] = 10; p[1] = 100; p[2] = 5; p[3] = 50;
    printf("matrix chain: %d\n", matrix_chain(1, 3)); // 7500
    return 0;
}` },
  { id: 50, category: 'algo', difficulty: 'hard', lang: 'c', name: '区间DP', code: `// 区间DP：在区间上做DP，dp[l][r]表示区间[l,r]的最优解
// 通常按区间长度从小到大枚举，分割点k在[l,r)内
// 经典问题：矩阵链乘法、石子合并、回文子串
#include <stdio.h>
#include <string.h>
#include <limits.h>
// 石子合并：相邻两堆合并，代价为两堆和，求最小总代价
int stone_merge(int stones[], int n) {
    int prefix[n + 1]; // 前缀和快速求区间和
    prefix[0] = 0;
    for (int i = 0; i < n; i++) prefix[i + 1] = prefix[i] + stones[i];
    int dp[n][n]; // dp[l][r]=合并[l,r]的最小代价
    memset(dp, 0, sizeof(dp));
    // 按区间长度从小到大
    for (int len = 2; len <= n; len++) {
        for (int l = 0; l + len <= n; l++) {
            int r = l + len - 1;
            dp[l][r] = INT_MAX;
            int sum = prefix[r + 1] - prefix[l]; // 区间和
            // 枚举分割点
            for (int k = l; k < r; k++) {
                int cost = dp[l][k] + dp[k + 1][r] + sum;
                if (cost < dp[l][r]) dp[l][r] = cost;
            }
        }
    }
    return dp[0][n - 1];
}

    memset(dp, 0, sizeof(dp));

    for (int i = 0; i < n; i++) dp[i][i] = 1; // 单字符是回文
    for (int len = 2; len <= n; len++) {
        for (int l = 0; l + len <= n; l++) {
            int r = l + len - 1;

int dist[MAXN][MAXN];
int dp[1 << MAXN][MAXN]; // dp[mask][i]=经过mask集合到达i的最短距离
// 旅行商问题TSP：从0出发经过所有点回到0的最短路径
int tsp(int n) {
    int full = (1 << n) - 1;
    for (int mask = 0; mask <= full; mask++)
        for (int i = 0; i < n; i++) dp[mask][i] = INF;
    dp[1][0] = 0; // 初始：只经过0号点
    for (int mask = 1; mask <= full; mask++) {
        for (int i = 0; i < n; i++) {
            if (!(mask & (1 << i)) || dp[mask][i] == INF) continue;
            // 尝试去下一个未访问的点j
            for (int j = 0; j < n; j++) {
                if (mask & (1 << j)) continue;
                int new_mask = mask | (1 << j);
                int new_dist = dp[mask][i] + dist[i][j];
                if (new_dist < dp[new_mask][j]) dp[new_mask][j] = new_dist;
            }
        }
    }
    // 所有点都访问过，回到0
    int result = INF;
    for (int i = 1; i < n; i++) {
        if (dp[full][i] != INF && dist[i][0]) {
            int total = dp[full][i] + dist[i][0];

// BFS实现的Edmonds-Karp算法，O(VE^2)
#include <stdio.h>

#include <limits.h>
#define MAXN 100
#define INF INT_MAX
int capacity[MAXN][MAXN]; // 残留容量
int parent[MAXN];
// BFS找增广路径
int bfs(int source, int sink, int n) {
    memset(parent, -1, sizeof(int) * n);
    parent[source] = source;
    int queue[MAXN], front = 0, rear = 0;
    queue[rear++] = source;
    while (front < rear) {
        int u = queue[front++];
        for (int v = 0; v < n; v++) {
            if (parent[v] == -1 && capacity[u][v] > 0) {
                parent[v] = u;
                if (v == sink) return 1; // 找到增广路径
                queue[rear++] = v;
            }
        }
    }
    return 0;
}

    int flow = 0;
    while (bfs(source, sink, n)) {
        // 找路径上的最小残留容量
        int path_flow = INF;
        for (int v = sink; v != source; v = parent[v]) {
            int u = parent[v];
            if (capacity[u][v] < path_flow) path_flow = capacity[u][v];

        for (int v = sink; v != source; v = parent[v]) {

            capacity[u][v] -= path_flow;
            capacity[v][u] += path_flow;

// 叉积判断方向：>0逆时针，<0顺时针，=0共线
#include <stdio.h>
#include <math.h>
typedef struct { double x, y; } Point;
// 叉积：(b-a) x (c-a)
double cross(Point a, Point b, Point c) {
    return (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
}
// 两点距离
double dist(Point a, Point b) {
    return sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y));
}
// 判断点是否在线段上
int on_segment(Point p, Point a, Point b) {
    return cross(a, b, p) == 0 &&
           p.x >= (a.x < b.x ? a.x : b.x) && p.x <= (a.x > b.x ? a.x : b.x) &&
           p.y >= (a.y < b.y ? a.y : b.y) && p.y <= (a.y > b.y ? a.y : b.y);
}
// 两线段是否相交
int segments_intersect(Point a1, Point a2, Point b1, Point b2) {
    double d1 = cross(b1, b2, a1);
    double d2 = cross(b1, b2, a2);
    double d3 = cross(a1, a2, b1);
    double d4 = cross(a1, a2, b2);
    if (((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) &&
        ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0))) return 1;
    // 共线情况
    if (d1 == 0 && on_segment(a1, b1, b2)) return 1;
    if (d2 == 0 && on_segment(a2, b1, b2)) return 1;
    if (d3 == 0 && on_segment(b1, a1, a2)) return 1;
    if (d4 == 0 && on_segment(b2, a1, a2)) return 1;
    return 0;
}
// 三角形面积（叉积/2的绝对值）
double triangle_area(Point a, Point b, Point c) {
    return fabs(cross(a, b, c)) / 2.0;
}

    Point p1 = {0, 0}, p2 = {2, 2}, p3 = {0, 2}, p4 = {2, 0};

  { id: 56, category: 'algo', difficulty: 'hard', lang: 'c', name: '莫队算法', code: `// 莫队算法：离线处理区间查询，通过调整左右指针减少重复计算
// 将查询排序，指针移动总复杂度O(n*sqrt(n))
// 适用于：区间不同元素个数、区间众数、区间和等可增量维护的问题
#include <stdio.h>
#include <math.h>
#include <stdlib.h>
#define MAXN 10000
int arr[MAXN];
int freq[MAXN]; // 元素出现频率
int current_answer = 0;
int block_size;
typedef struct { int l, r, id; } Query;
Query queries[MAXN];
int answers[MAXN];
// 莫队排序：按块排序，块内按r排序（奇偶优化）
int cmp(const void *a, const void *b) {
    Query *qa = (Query *)a, *qb = (Query *)b;
    if (qa->l / block_size != qb->l / block_size)
        return qa->l - qb->l;
    // 奇偶优化：奇数块r升序，偶数块r降序
    return (qa->l / block_size % 2) ? (qb->r - qa->r) : (qa->r - qb->r);
}
// 添加一个元素
void add(int pos) {
    if (freq[arr[pos]] == 0) current_answer++; // 新元素
    freq[arr[pos]]++;
}
// 移除一个元素
void remove(int pos) {
    freq[arr[pos]]--;
    if (freq[arr[pos]] == 0) current_answer--; // 元素消失
}
void mo_algorithm(int n, int q) {
    block_size = sqrt(n);
    qsort(queries, q, sizeof(Query), cmp);
    int cur_l = 0, cur_r = -1;
    for (int i = 0; i < q; i++) {
        int l = queries[i].l, r = queries[i].r;
        // 调整指针
        while (cur_l > l) add(--cur_l);
        while (cur_r < r) add(++cur_r);
        while (cur_l < l) remove(cur_l++);
        while (cur_r > r) remove(cur_r--);
        answers[queries[i].id] = current_answer;
    }
}
int main() {
    int n = 6, q = 3;
    int a[] = {1, 2, 3, 2, 1, 3};
    for (int i = 0; i < n; i++) arr[i] = a[i];
    queries[0] = (Query){0, 2, 0}; // 1,2,3 -> 3种
    queries[1] = (Query){1, 3, 1}; // 2,3,2 -> 2种
    queries[2] = (Query){0, 5, 2}; // 全部 -> 3种
    mo_algorithm(n, q);
    for (int i = 0; i < q; i++) printf("Query %d: %d distinct\n", i, answers[i]);
    return 0;
}` },

// 构建O(n)，可解决子串计数、不同子串数、最长公共子串等
#include <stdio.h>
#include <string.h>
#define MAXN 200
int len[MAXN * 2]; // 状态对应的最长子串长度
int link[MAXN * 2]; // suffix link
int next[MAXN * 2][26]; // 转移
int last = 0, size = 1;
long long distinct_count = 0;
// SAM扩展：添加一个字符
void sa_extend(int c) {
    int cur = size++;
    len[cur] = len[last] + 1;
    distinct_count += len[cur] - len[link[cur]]; // 新增不同子串数
    int p = last;
    // 沿suffix link找没有c转移的状态
    while (p != -1 && !next[p][c]) {
        next[p][c] = cur;
        p = link[p];
    }
    if (p == -1) {
        link[cur] = 0; // 指向初始状态
    } else {
        int q = next[p][c];
        if (len[p] + 1 == len[q]) {
            link[cur] = q; // q可以直接作为cur的link
        } else {
            // 克隆q状态
            int clone = size++;
            len[clone] = len[p] + 1;
            memcpy(next[clone], next[q], sizeof(next[q]));
            link[clone] = link[q];
            distinct_count += len[clone] - len[link[clone]];
            // 重定向转移
            while (p != -1 && next[p][c] == q) {
                next[p][c] = clone;
                p = link[p];
            }
            link[q] = link[cur] = clone;
        }
    }
    last = cur;
}
int main() {

  { id: 58, category: 'algo', difficulty: 'hard', lang: 'c', name: '最小费用最大流', code: `// 最小费用最大流：在最大流基础上求最小费用
// SPFA找最短增广路径（费用为边权），每次增广
#include <stdio.h>
#include <string.h>
#include <limits.h>
#define MAXN 100
#define INF INT_MAX
typedef struct { int to, cap, cost, next; } Edge;
Edge edges[MAXN * 2];
int head[MAXN], edge_count = 0;
int dist[MAXN], prev_node[MAXN], prev_edge[MAXN], in_queue[MAXN];
void add_edge(int u, int v, int cap, int cost) {
    edges[edge_count] = (Edge){v, cap, cost, head[u]};
    head[u] = edge_count++;
    edges[edge_count] = (Edge){u, 0, -cost, head[v]}; // 反向边费用为负
    head[v] = edge_count++;
}
// SPFA找最短费用增广路
int spfa(int source, int sink, int n) {
    for (int i = 0; i < n; i++) { dist[i] = INF; in_queue[i] = 0; }
    dist[source] = 0;
    int queue[MAXN], front = 0, rear = 0;
    queue[rear++] = source;
    in_queue[source] = 1;
    while (front != rear) {
        int u = queue[front++];
        in_queue[u] = 0;
        for (int e = head[u]; e != -1; e = edges[e].next) {
            int v = edges[e].to;
            if (edges[e].cap > 0 && dist[u] + edges[e].cost < dist[v]) {
                dist[v] = dist[u] + edges[e].cost;
                prev_node[v] = u;
                prev_edge[v] = e;
                if (!in_queue[v]) {
                    queue[rear++] = v;
                    in_queue[v] = 1;
                }
            }
        }
    }
    return dist[sink] != INF;
}
void min_cost_max_flow(int source, int sink, int n, int *max_flow, int *min_cost) {
    *max_flow = 0; *min_cost = 0;
    while (spfa(source, sink, n)) {
        int flow = INF;
        for (int v = sink; v != source; v = prev_node[v]) {
            int e = prev_edge[v];
            if (edges[e].cap < flow) flow = edges[e].cap;
        }
        for (int v = sink; v != source; v = prev_node[v]) {
            int e = prev_edge[v];
            edges[e].cap -= flow;
            edges[e ^ 1].cap += flow;
        }
        *max_flow += flow;
        *min_cost += flow * dist[sink];
    }
}
int main() {
    memset(head, -1, sizeof(head));
    add_edge(0, 1, 10, 2);
    add_edge(0, 2, 5, 3);
    add_edge(1, 2, 4, 1);
    add_edge(1, 3, 8, 1);
    add_edge(2, 3, 10, 1);
    int flow, cost;
    min_cost_max_flow(0, 3, 4, &flow, &cost);
    printf("max flow: %d, min cost: %d\n", flow, cost);
    return 0;
}` },

  { id: 60, category: 'dl', difficulty: 'easy', lang: 'python', name: '感知机', code: `# 感知机：最简单的神经网络模型，二分类线性分类器
# y = sign(w·x + b)，通过误分类点更新权重
import numpy as np
class Perceptron:
    def __init__(self, lr=0.01, n_iters=1000):
        self.lr = lr          # 学习率
        self.n_iters = n_iters # 迭代次数
        self.weights = None
        self.bias = None
    # 激活函数：大于0返回1，否则返回0
    def activation(self, x):
        return np.where(x >= 0, 1, 0)
    def fit(self, X, y):
        n_samples, n_features = X.shape
        self.weights = np.zeros(n_features)
        self.bias = 0
        # 迭代训练
        for _ in range(self.n_iters):
            for idx, x_i in enumerate(X):
                # 线性输出 z = w·x + b
                linear_output = np.dot(x_i, self.weights) + self.bias
                y_pred = self.activation(linear_output)
                # 只在误分类时更新：w += lr*(y_true-y_pred)*x
                update = self.lr * (y[idx] - y_pred)
                self.weights += update * x_i
                self.bias += update
    def predict(self, X):
        linear_output = np.dot(X, self.weights) + self.bias
        return self.activation(linear_output)
# 测试：与门

def binary_cross_entropy(y_true, y_pred):
    # 加epsilon防止log(0)
    eps = 1e-15
    y_pred = np.clip(y_pred, eps, 1 - eps)

def categorical_cross_entropy(y_true, y_pred):

    return -np.mean(np.sum(y_true * np.log(y_pred), axis=1))

# 三种变体：批量GD、随机SGD、小批量Mini-batch
import numpy as np
# 批量梯度下降BGD：用全部数据计算梯度，稳定但慢
def batch_gradient_descent(X, y, lr=0.01, n_iters=1000):
    n_samples, n_features = X.shape
    w = np.zeros(n_features)
    b = 0
    for _ in range(n_iters):
        y_pred = np.dot(X, w) + b
        dw = (2 / n_samples) * np.dot(X.T, (y_pred - y))
        db = (2 / n_samples) * np.sum(y_pred - y)
        w -= lr * dw
        b -= lr * db
    return w, b
# 随机梯度下降SGD：每次用一个样本，快但震荡
def sgd(X, y, lr=0.01, n_iters=100):
    n_samples, n_features = X.shape
    w = np.zeros(n_features)
    b = 0
    for _ in range(n_iters):
        for i in range(n_samples):
            y_pred = np.dot(X[i], w) + b
            dw = 2 * X[i] * (y_pred - y[i])
            db = 2 * (y_pred - y[i])
            w -= lr * dw
            b -= lr * db
    return w, b

        X_shuffled = X[indices]
        y_shuffled = y[indices]
        for i in range(0, n_samples, batch_size):

            y_batch = y_shuffled[i:i+batch_size]
            y_pred = np.dot(X_batch, w) + b
            dw = (2 / len(X_batch)) * np.dot(X_batch.T, (y_pred - y_batch))
            db = (2 / len(X_batch)) * np.sum(y_pred - y_batch)
            w -= lr * dw

# 核心：dL/dw = dL/dy * dy/dz * dz/dw（链式法则）
import numpy as np
def sigmoid(x):
    return 1 / (1 + np.exp(-x))
def sigmoid_derivative(x):
    s = sigmoid(x)
    return s * (1 - s)
# 两层神经网络：输入->隐藏->输出
class TwoLayerNet:
    def __init__(self, input_size, hidden_size, output_size):
        # 随机初始化权重（小随机数）
        self.W1 = np.random.randn(input_size, hidden_size) * 0.1
        self.b1 = np.zeros(hidden_size)
        self.W2 = np.random.randn(hidden_size, output_size) * 0.1
        self.b2 = np.zeros(output_size)
    def forward(self, X):
        # 前向传播：保存中间值用于反向
        self.z1 = np.dot(X, self.W1) + self.b1
        self.a1 = sigmoid(self.z1)
        self.z2 = np.dot(self.a1, self.W2) + self.b2
        self.a2 = sigmoid(self.z2)
        return self.a2
    def backward(self, X, y, lr):
        m = X.shape[0]
        # 输出层梯度：dL/dz2 = (a2-y) * sigmoid'(z2)
        dz2 = (self.a2 - y) * sigmoid_derivative(self.z2)
        dW2 = np.dot(self.a1.T, dz2) / m
        db2 = np.sum(dz2, axis=0) / m
        # 隐藏层梯度：dL/dz1 = (dz2·W2^T) * sigmoid'(z1)
        dz1 = np.dot(dz2, self.W2.T) * sigmoid_derivative(self.z1)
        dW1 = np.dot(X.T, dz1) / m
        db1 = np.sum(dz1, axis=0) / m
        # 更新参数
        self.W1 -= lr * dW1
        self.b1 -= lr * db1
        self.W2 -= lr * dW2
        self.b2 -= lr * db2
    def train(self, X, y, lr=0.1, epochs=1000):
        for epoch in range(epochs):
            self.forward(X)
            self.backward(X, y, lr)
            if epoch % 200 == 0:
                loss = np.mean((self.a2 - y) ** 2)
                print(f"Epoch {epoch}, loss: {loss:.4f}")

# 常用：Z-score标准化、Min-Max归一化、归一化到单位长度
import numpy as np
# Z-score标准化：均值0，标准差1，最常用
# x' = (x - μ) / σ
class StandardScaler:
    def fit(self, X):
        self.mean_ = np.mean(X, axis=0)
        self.std_ = np.std(X, axis=0)
        self.std_[self.std_ == 0] = 1  # 防止除零
    def transform(self, X):
        return (X - self.mean_) / self.std_
    def fit_transform(self, X):
        self.fit(X)
        return self.transform(X)
# Min-Max归一化：缩放到[0,1]
# x' = (x - min) / (max - min)
class MinMaxScaler:
    def fit(self, X):
        self.min_ = np.min(X, axis=0)
        self.max_ = np.max(X, axis=0)
        self.range_ = self.max_ - self.min_
        self.range_[self.range_ == 0] = 1
    def transform(self, X):
        return (X - self.min_) / self.range_
    def fit_transform(self, X):
        self.fit(X)
        return self.transform(X)

  { id: 69, category: 'dl', difficulty: 'easy', lang: 'python', name: '模型评估指标', code: `# 模型评估：分类用准确率/精确率/召回率/F1/AUC，回归用MSE/MAE/R²
import numpy as np
# 混淆矩阵：TP真阳 FP假阳 FN假阴 TN真阴
def confusion_matrix(y_true, y_pred):
    TP = np.sum((y_true == 1) & (y_pred == 1))
    FP = np.sum((y_true == 0) & (y_pred == 1))
    FN = np.sum((y_true == 1) & (y_pred == 0))
    TN = np.sum((y_true == 0) & (y_pred == 0))
    return np.array([[TN, FP], [FN, TP]])
# 准确率：(TP+TN)/(TP+FP+FN+TN)
def accuracy(y_true, y_pred):
    return np.mean(y_true == y_pred)
# 精确率：TP/(TP+FP)，预测为正的里面真的正的比例
def precision(y_true, y_pred):
    TP = np.sum((y_true == 1) & (y_pred == 1))
    FP = np.sum((y_true == 0) & (y_pred == 1))
    return TP / (TP + FP) if (TP + FP) > 0 else 0
# 召回率：TP/(TP+FN)，真正为正的里面被预测出来的比例
def recall(y_true, y_pred):
    TP = np.sum((y_true == 1) & (y_pred == 1))
    FN = np.sum((y_true == 1) & (y_pred == 0))
    return TP / (TP + FN) if (TP + FN) > 0 else 0
# F1分数：精确率和召回率的调和平均
def f1_score(y_true, y_pred):
    p = precision(y_true, y_pred)
    r = recall(y_true, y_pred)

# R²分数：回归模型解释的方差比例

    ss_res = np.sum((y_true - y_pred) ** 2)
    ss_tot = np.sum((y_true - np.mean(y_true)) ** 2)

# 输出尺寸 = (输入尺寸 - 卷积核尺寸 + 2*填充) / 步长 + 1
import numpy as np
def conv2d(input_data, kernel, stride=1, padding=0):
    # input_data: (H, W), kernel: (kh, kw)
    H, W = input_data.shape
    kh, kw = kernel.shape
    # 填充
    if padding > 0:
        input_data = np.pad(input_data, ((padding, padding), (padding, padding)))
    # 计算输出尺寸
    out_h = (H + 2 * padding - kh) // stride + 1
    out_w = (W + 2 * padding - kw) // stride + 1
    output = np.zeros((out_h, out_w))
    # 滑动窗口做卷积（实际是互相关）
    for i in range(out_h):
        for j in range(out_w):
            # 取当前窗口
            window = input_data[i*stride:i*stride+kh, j*stride:j*stride+kw]
            output[i, j] = np.sum(window * kernel)
    return output
# 多通道卷积：输入(C, H, W)，卷积核(num_filters, C, kh, kw)
def conv2d_multi_channel(input_data, kernels, stride=1, padding=0):
    C, H, W = input_data.shape
    num_filters, _, kh, kw = kernels.shape
    if padding > 0:
        input_data = np.pad(input_data, ((0,0),(padding,padding),(padding,padding)))
    out_h = (H + 2*padding - kh) // stride + 1
    out_w = (W + 2*padding - kw) // stride + 1
    output = np.zeros((num_filters, out_h, out_w))
    for f in range(num_filters):
        for i in range(out_h):
            for j in range(out_w):
                window = input_data[:, i*stride:i*stride+kh, j*stride:j*stride+kw]
                output[f, i, j] = np.sum(window * kernels[f])
    return output

# 三个门：遗忘门f、输入门i、输出门o，细胞状态c传递长期记忆
import numpy as np
def sigmoid(x):
    return 1 / (1 + np.exp(-x))
class LSTM:
    def __init__(self, input_size, hidden_size):
        self.hidden_size = hidden_size
        # 四个门的权重合并：f, i, o, g(候选细胞)
        self.W = np.random.randn(4 * hidden_size, input_size + hidden_size) * 0.1
        self.b = np.zeros(4 * hidden_size)

        c = np.zeros(self.hidden_size)  # 细胞状态
        self.hidden_states = []
        for x_t in x_sequence:
            # 拼接输入和隐藏状态
            combined = np.concatenate([x_t, h])
            gates = np.dot(self.W, combined) + self.b
            # 分割为四个门
            f = sigmoid(gates[:self.hidden_size])           # 遗忘门
            i = sigmoid(gates[self.hidden_size:2*self.hidden_size])  # 输入门
            o = sigmoid(gates[2*self.hidden_size:3*self.hidden_size]) # 输出门

            c = f * c + i * g
            # 隐藏状态：输出门控制细胞状态的输出
            h = o * np.tanh(c)
            self.hidden_states.append(h)

# SGD带动量、Adam（自适应学习率）最常用
import numpy as np
# SGD带动量：累积历史梯度方向，加速收敛，抑制震荡
class SGDMomentum:
    def __init__(self, lr=0.01, momentum=0.9):
        self.lr = lr
        self.momentum = momentum
        self.velocity = None
    def update(self, params, grads):
        if self.velocity is None:
            self.velocity = [np.zeros_like(p) for p in params]
        for i in range(len(params)):
            # v = momentum*v - lr*grad
            self.velocity[i] = self.momentum * self.velocity[i] - self.lr * grads[i]
            params[i] += self.velocity[i]
# Adam：结合动量和自适应学习率，最常用
# m = β1*m + (1-β1)*grad  (一阶矩估计)
# v = β2*v + (1-β2)*grad² (二阶矩估计)
# m_hat = m/(1-β1^t), v_hat = v/(1-β2^t) (偏差修正)
# θ -= lr * m_hat / (sqrt(v_hat)+eps)
class Adam:
    def __init__(self, lr=0.001, beta1=0.9, beta2=0.999, eps=1e-8):
        self.lr = lr
        self.beta1 = beta1
        self.beta2 = beta2
        self.eps = eps
        self.t = 0
        self.m = None
        self.v = None
    def update(self, params, grads):
        if self.m is None:
            self.m = [np.zeros_like(p) for p in params]
            self.v = [np.zeros_like(p) for p in params]
        self.t += 1
        for i in range(len(params)):
            self.m[i] = self.beta1 * self.m[i] + (1 - self.beta1) * grads[i]
            self.v[i] = self.beta2 * self.v[i] + (1 - self.beta2) * (grads[i] ** 2)
            # 偏差修正
            m_hat = self.m[i] / (1 - self.beta1 ** self.t)
            v_hat = self.v[i] / (1 - self.beta2 ** self.t)
            params[i] -= self.lr * m_hat / (np.sqrt(v_hat) + self.eps)

# 公式：x_hat = (x - μ_B)/sqrt(σ_B²+eps)，y = γ*x_hat + β
# 训练时用batch统计，推理时用滑动平均
import numpy as np
class BatchNorm:
    def __init__(self, num_features, momentum=0.9, eps=1e-5):
        self.gamma = np.ones(num_features)  # 可学习缩放
        self.beta = np.zeros(num_features)   # 可学习偏移
        self.momentum = momentum
        self.eps = eps
        # 推理时用的全局统计
        self.running_mean = np.zeros(num_features)
        self.running_var = np.ones(num_features)
    def forward(self, x, training=True):
        if training:
            # 计算batch的均值和方差
            batch_mean = np.mean(x, axis=0)
            batch_var = np.var(x, axis=0)
            # 归一化
            self.x_hat = (x - batch_mean) / np.sqrt(batch_var + self.eps)
            # 缩放和平移
            out = self.gamma * self.x_hat + self.beta
            # 更新滑动平均（用于推理）
            self.running_mean = self.momentum * self.running_mean + (1 - self.momentum) * batch_mean
            self.running_var = self.momentum * self.running_var + (1 - self.momentum) * batch_var
            return out
        else:
            # 推理时用全局统计
            x_hat = (x - self.running_mean) / np.sqrt(self.running_var + self.eps)
            return self.gamma * x_hat + self.beta
    def backward(self, dout, x):
        # 反向传播（简化版）
        N = x.shape[0]
        batch_mean = np.mean(x, axis=0)
        batch_var = np.var(x, axis=0)
        std = np.sqrt(batch_var + self.eps)
        dx_hat = dout * self.gamma
        dvar = np.sum(dx_hat * (x - batch_mean) * -0.5 * std**-3, axis=0)
        dmean = np.sum(dx_hat * -1/std, axis=0) + dvar * np.mean(-2*(x-batch_mean), axis=0)
        dx = dx_hat / std + dvar * 2*(x-batch_mean)/N + dmean / N
        self.dgamma = np.sum(dout * self.x_hat, axis=0)
        self.dbeta = np.sum(dout, axis=0)
        return dx
# 测试

x = np.random.randn(32, 3) * 5 + 10  # 非标准化数据
out = bn.forward(x, training=True)

print("输出均值:", np.round(np.mean(out, axis=0), 3))  # ≈0

        if self.downsample is not None:

function tokenize(code, lang) {
  const tokens = [];
  const lines = code.split('\n');
  const kw = KEYWORDS[lang] || new Set();
  const ty = TYPES[lang] || new Set();
  const lineComment = { rust: '//', c: '//', python: '#' }[lang] || '//';
  const blockComment = (lang === 'python') ? null : ['/*', '*/'];
  let inBlockComment = false;

  for (let li = 0; li < lines.length; li++) {
    const line = lines[li];
    let i = 0;
    let lineTokens = [];
    while (i < line.length) {
      if (inBlockComment) {
        const end = line.indexOf('*/', i);
        if (end === -1) { for (let j = i; j < line.length; j++) lineTokens.push({ char: line[j], type: 'comment', typable: false }); i = line.length; }
        else { for (let j = i; j <= end + 1; j++) lineTokens.push({ char: line[j], type: 'comment', typable: false }); i = end + 2; inBlockComment = false; }
        continue;
      }
      if (blockComment && line.substr(i, 2) === '/*') {
        const end = line.indexOf('*/', i + 2);
        if (end === -1) { for (let j = i; j < line.length; j++) lineTokens.push({ char: line[j], type: 'comment', typable: false }); i = line.length; inBlockComment = true; }
        else { for (let j = i; j <= end + 1; j++) lineTokens.push({ char: line[j], type: 'comment', typable: false }); i = end + 2; }
        continue;
      }
      if (line.substr(i, lineComment.length) === lineComment) {
        for (let j = i; j < line.length; j++) lineTokens.push({ char: line[j], type: 'comment', typable: false });
        i = line.length; continue;
      }
      if (line[i] === '"' || line[i] === "'") {
        const quote = line[i];
        lineTokens.push({ char: line[i], type: 'string', typable: true }); i++;
        while (i < line.length && line[i] !== quote) {
          if (line[i] === '\\' && i + 1 < line.length) { lineTokens.push({ char: line[i], type: 'string', typable: true }); lineTokens.push({ char: line[i+1], type: 'string', typable: true }); i += 2; }
          else { lineTokens.push({ char: line[i], type: 'string', typable: true }); i++; }
        }
        if (i < line.length) { lineTokens.push({ char: line[i], type: 'string', typable: true }); i++; }
        continue;
      }
      if (/[a-zA-Z_]/.test(line[i])) {
        let word = ''; let start = i;
        while (i < line.length && /[a-zA-Z0-9_]/.test(line[i])) { word += line[i]; i++; }
        const isMacro = line[i] === '!';
        const isFuncCall = line[i] === '(';
        let type = 'code';
        if (kw.has(word)) type = 'keyword';
        else if (ty.has(word)) type = 'type';
        else if (isMacro || (isFuncCall && /^[a-z]/.test(word))) type = 'function';
        for (let j = start; j < i; j++) lineTokens.push({ char: line[j], type, typable: true });
        continue;
      }
      if (/[0-9]/.test(line[i])) {
        let start = i;
        while (i < line.length && /[0-9.xXa-fA-F_]/.test(line[i])) i++;
        for (let j = start; j < i; j++) lineTokens.push({ char: line[j], type: 'number', typable: true });
        continue;
      }
      lineTokens.push({ char: line[i], type: 'code', typable: true }); i++;
    }
    if (li < lines.length - 1) {
      lineTokens.push({ char: '\n', type: inBlockComment ? 'comment' : 'code', typable: !inBlockComment });
    }
    tokens.push(lineTokens);
  }
  return tokens;
}
